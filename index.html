<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedidos - Gerenciador de Pedidos</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Biblioteca para gerar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Biblioteca para gerar PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>
<body>

    <!-- LOADING OVERLAY -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <i class="fas fa-spinner"></i>
            <div class="loading-text">Gerando documento...</div>
        </div>
    </div>

    <!-- BARRA LATERAL -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-folder-open"></i>
            <span>Pedidos Salvos</span>
        </div>
        <div class="order-list" id="order-list">
            <!-- Itens carregados via JS -->
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-area">
        <!-- Barra de Ferramentas -->
        <div class="topbar">
            <div class="brand">
                <i class="fas fa-file-invoice"></i>
                <span>Pedidos</span>
            </div>
            <button class="btn menu-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="topbar-actions">
                <button class="btn" onclick="novoPedido()">
                    <i class="fas fa-plus"></i> Novo
                </button>
                <button class="btn btn-primary" onclick="salvarPedidoNomeado()">
                    <i class="fas fa-save"></i> Salvar
                </button>
                <button class="btn btn-success" onclick="gerarPDFAltaQualidade()">
                    <i class="fas fa-file-pdf"></i> PDF 300 DPI
                </button>
                <button class="btn" onclick="gerarPDFBaixaQualidade()">
                    <i class="fas fa-file-pdf"></i> PDF 72 DPI
                </button>
                <button class="btn" onclick="gerarPNG()">
                    <i class="fas fa-file-image"></i> PNG
                </button>
            </div>
        </div>

        <!-- Área do Papel -->
        <div class="paper-container" onclick="closeSidebarMobile()">
            <div class="page" id="folha-pedido">
                <div class="border-box">

                    <!-- Cabeçalho -->
                    <div class="header-section">
                        <div class="pedido-box">
                            <span class="label">PEDIDO Nº</span>
                            <input type="text" id="pedido-num" oninput="saveDraft()">
                        </div>
                        <div class="data-box">
                            <span class="label">DATA</span>
                            <div class="data-inputs">
                                <input type="text" id="data-d" maxlength="2" oninput="saveDraft()">
                                <span>/</span>
                                <input type="text" id="data-m" maxlength="2" oninput="saveDraft()">
                                <span>/</span>
                                <input type="text" id="data-a" maxlength="4" oninput="saveDraft()">
                            </div>
                        </div>
                    </div>

                    <!-- Dados Cliente -->
                    <div class="flex-row">
                        <div class="col" style="width: 70%;">
                            <span class="label"><i class="fas fa-user" style="margin-right:4px;"></i>NOME:</span>
                            <input type="text" id="cli-nome" oninput="saveDraft()">
                        </div>
                        <div class="col" style="width: 30%;">
                            <span class="label"><i class="fas fa-phone" style="margin-right:4px;"></i>TEL:</span>
                            <input type="text" id="cli-tel" oninput="saveDraft()">
                        </div>
                    </div>
                    <div class="flex-row">
                        <div class="col" style="width: 70%;">
                            <span class="label"><i class="fas fa-home" style="margin-right:4px;"></i>ENDEREÇO:</span>
                            <input type="text" id="cli-end" oninput="saveDraft()">
                        </div>
                        <div class="col" style="width: 30%;">
                            <span class="label">BAIRRO:</span>
                            <input type="text" id="cli-bairro" oninput="saveDraft()">
                        </div>
                    </div>
                    <div class="flex-row">
                        <div class="col" style="width: 60%;">
                            <span class="label"><i class="fas fa-city" style="margin-right:4px;"></i>MUNICIPIO:</span>
                            <input type="text" id="cli-mun" oninput="saveDraft()">
                        </div>
                        <div class="col" style="width: 15%;">
                            <span class="label">UF</span>
                            <input type="text" id="cli-uf" maxlength="2" style="text-align:center;" oninput="saveDraft()">
                        </div>
                        <div class="col" style="width: 25%;">
                            <span class="label"><i class="fas fa-map-pin"></i> CEP</span>
                            <input type="text" id="cli-cep" oninput="saveDraft()">
                        </div>
                    </div>

                    <!-- Tabela de Itens -->
                    <div class="items-section">
                        <table>
                            <thead>
                                <tr>
                                    <th class="col-quant"><i class="fas fa-hashtag"></i> QUANT.</th>
                                    <th class="col-desc"><i class="fas fa-align-left"></i> DESCRIÇÃO</th>
                                    <th class="col-preco"><i class="fas fa-dollar-sign"></i> PREÇO UNT.</th>
                                    <th class="col-total"><i class="fas fa-calculator"></i> TOTAL</th>
                                </tr>
                            </thead>
                            <tbody id="items-body">
                                <!-- Linhas geradas via JS -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Rodapé -->
                    <div class="footer-section">
                        <div class="footer-left"></div>
                        <div class="footer-right">
                            <span class="total-label"><i class="fas fa-calculator"></i> TOTAL R$:</span>
                            <div class="total-value" id="total-geral">R$ 0,00</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <style>
        /* ============================================================
           Apenas o necessário para a ANIMAÇÃO dos números e para a
           responsividade Android — não altera nenhuma cor, fonte,
           layout de papel ou variáveis do CSS dinâmico já carregado.
        ============================================================ */

        /* --- Efeito de "número rolando com blur" (estilo app financeiro) --- */
        .total-value {
            position: relative;
            display: inline-block;
            overflow: hidden;
        }
        .total-value .num-roll {
            display: inline-block;
            animation: numRollIn 0.38s cubic-bezier(.22,.68,.36,1);
            filter: blur(0);
        }
        @keyframes numRollIn {
            0%   { transform: translateY(45%); opacity: 0; filter: blur(6px); }
            60%  { opacity: 1; }
            100% { transform: translateY(0);   opacity: 1; filter: blur(0); }
        }
        .item-t.pulsing {
            animation: fieldPulse 0.35s ease;
        }
        @keyframes fieldPulse {
            0%   { filter: blur(3px); opacity: .5; }
            100% { filter: blur(0);   opacity: 1; }
        }

        /* --- Responsividade extra para Android/telas pequenas ---
           Só ajusta espaçamentos/quebras, sem redefinir cores/fontes. */
        @media (max-width: 480px) {
            .topbar-actions {
                flex-wrap: wrap;
                gap: 6px;
            }
            .topbar-actions .btn {
                flex: 1 1 auto;
                min-width: 0;
                font-size: 0.82em;
                padding: 8px 6px;
                justify-content: center;
            }
            .topbar-actions .btn i { margin-right: 4px; }

            .flex-row { flex-wrap: wrap; }
            .flex-row .col { width: 100% !important; margin-bottom: 6px; }

            .header-section { flex-wrap: wrap; gap: 8px; }
            .pedido-box, .data-box { width: 100%; }

            table, thead, tbody, th, td, tr { display: block; width: 100%; }
            .items-section table thead { display: none; }
            .items-section table tbody tr {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 4px 8px;
                margin-bottom: 8px;
            }
            .col-desc { grid-column: 1 / -1; }
            .col-quant::before   { content: "Quant."; display:block; font-size:.7em; opacity:.65; }
            .col-desc::before    { content: "Descrição"; display:block; font-size:.7em; opacity:.65; }
            .col-preco::before   { content: "Preço Unt."; display:block; font-size:.7em; opacity:.65; }
            .col-total::before   { content: "Total"; display:block; font-size:.7em; opacity:.65; }

            .footer-section { flex-direction: column; align-items: stretch; gap: 10px; }
            .footer-right { justify-content: space-between; }
        }

        @media (max-width: 480px) and (orientation: portrait) {
            .paper-container { padding: 6px; }
        }
    </style>

    <script>
        // ============================================================
        // DETECÇÃO DE DISPOSITIVO E CARGA DE CSS PERSONALIZADO
        // (inalterado — CSS dinâmico permanece como está)
        // ============================================================
        async function carregarCssPorDispositivo() {
            const uaString = navigator.userAgent.toLowerCase();
            let arquivoCss = "default.css";
            const pastaCss = "./css/";

            if (navigator.userAgentData) {
                try {
                    const ua = await navigator.userAgentData.getHighEntropyValues(['platformVersion', 'model']);
                    const plataforma = navigator.userAgentData.platform.toLowerCase();
                    const modelo = ua.model ? ua.model.toLowerCase() : "";

                    if (plataforma === "windows") {
                        const buildWindows = parseInt(ua.platformVersion.split('.'));
                        if (buildWindows >= 14) arquivoCss = "win11.css";
                        else if (buildWindows > 0) arquivoCss = "win10.css";
                        else arquivoCss = checarFallbackWindows(uaString);
                        injetarEstilo(pastaCss + arquivoCss);
                        return;
                    }

                    if (plataforma === "android" || uaString.includes("android")) {
                        arquivoCss = classificarMarcaAndroid(modelo, uaString);
                        injetarEstilo(pastaCss + arquivoCss);
                        return;
                    }
                } catch (e) { /* fallback */ }
            }

            if (uaString.includes("macintosh") && !navigator.maxTouchPoints) {
                const matchMac = uaString.match(/mac os x (\d+)[_.](\d+)/);
                if (matchMac) {
                    const versaoPrincipal = parseInt(matchMac[1]);
                    arquivoCss = `macos${versaoPrincipal}.css`;
                } else {
                    arquivoCss = "macos-generico.css";
                }
                injetarEstilo(pastaCss + arquivoCss);
                return;
            }

            const éiPad = uaString.includes("ipad") || (uaString.includes("macintosh") && navigator.maxTouchPoints > 1);
            const éiPhone = uaString.includes("iphone");

            if (éiPhone || éiPad) {
                const dispositivo = éiPhone ? "ios" : "ipados";
                const matchApple = uaString.match(/os (\d+)_/);
                if (matchApple) {
                    const versaoOS = parseInt(matchApple[1]);
                    arquivoCss = `${dispositivo}${versaoOS}.css`;
                } else {
                    arquivoCss = `${dispositivo}-generico.css`;
                }
                injetarEstilo(pastaCss + arquivoCss);
                return;
            }

            if (uaString.includes("android")) {
                arquivoCss = classificarMarcaAndroid("", uaString);
            } else {
                arquivoCss = checarFallbackWindows(uaString);
            }
            injetarEstilo(pastaCss + arquivoCss);
        }

        function checarFallbackWindows(uaString) {
            if (uaString.includes("windows nt 10.0")) return "win10.css";
            if (uaString.includes("windows nt 6.1")) return "win7.css";
            return "default.css";
        }

        function classificarMarcaAndroid(modelo, uaString) {
            const texto = (modelo + " " + uaString).toLowerCase();
            if (texto.includes("samsung") || texto.includes("sm-") || texto.includes("sec-")) return "samsung.css";
            if (texto.includes("pixel") || texto.includes("nexus")) return "pixel.css";
            if (texto.includes("xiaomi") || texto.includes("redmi") || texto.includes("poco") || texto.includes("mi ")) return "xiaomi.css";
            return "android-generico.css";
        }

        function injetarEstilo(caminhoCompleto) {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.type = "text/css";
            link.href = caminhoCompleto;
            document.getElementsByTagName("head")[0].appendChild(link);
        }

        // Inicializa a carga imediatamente
        carregarCssPorDispositivo();

        // ============================================================
        // LÓGICA PRINCIPAL DO PEDIDO
        // ============================================================
        const tbody = document.getElementById('items-body');
        const MIN_ROWS = 15;
        let activeOrderId = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function closeSidebarMobile() {
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('active');
            }
        }

        // ------------------------------------------------------------
        // FORMATAÇÃO DE MOEDA — CORRIGIDA
        // Antes: parseMoney fazia replace(/\./g,'') em QUALQUER texto,
        // então digitar "70" (inteiro) virava "70", mas ao formatar o
        // total com toFixed(2) e trocar ponto por vírgula, um valor já
        // formatado (ex: "9.999,99") era relido e o ponto de milhar
        // era removido incorretamente em cascata, gerando totais
        // absurdos como 70 x 30 = "210.000" em vez de "2.100,00".
        // Agora os valores são guardados sempre como NÚMERO (float)
        // internamente, e só formatados para exibição — nunca
        // reprocessados a partir de uma string já formatada.
        // ------------------------------------------------------------

        // Converte string digitada (podendo ter . de milhar e , decimal) em número
        function parseMoney(str) {
            if (str === null || str === undefined || str === '') return 0;
            str = String(str).trim();
            // remove tudo que não é dígito, ponto, vírgula ou sinal
            str = str.replace(/[^\d.,-]/g, '');
            if (str === '') return 0;

            const temVirgula = str.includes(',');
            const temPonto = str.includes('.');

            if (temVirgula && temPonto) {
                // formato 9.999,99 -> ponto é milhar, vírgula é decimal
                str = str.replace(/\./g, '').replace(',', '.');
            } else if (temVirgula) {
                // formato 9999,99 -> vírgula é decimal
                str = str.replace(',', '.');
            } else if (temPonto) {
                // Só ponto: se houver mais de 2 dígitos após o único ponto
                // e o ponto não estiver a exatamente 3 dígitos do fim seguido
                // de outro grupo, tratamos como decimal (ex: "70.5"); mas se
                // parecer separador de milhar (ex: "1.234"), tratamos como milhar.
                const partes = str.split('.');
                if (partes.length === 2 && partes[1].length === 3 && partes[0].length <= 3) {
                    // ambíguo tipo "1.234" — assume milhar (padrão BR)
                    str = str.replace('.', '');
                }
                // senão mantém o ponto como decimal (ex: "70.50")
            }
            const n = parseFloat(str);
            return isNaN(n) ? 0 : n;
        }

        // Formata número para exibição: R$ 9.999,99
        function formatMoneyDisplay(value, comPrefixo = false) {
            const n = isNaN(value) ? 0 : Number(value);
            const formatado = n.toLocaleString('pt-BR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            return comPrefixo ? `R$ ${formatado}` : formatado;
        }

        // Formata apenas para os campos de input (sem R$, ex: 9.999,99)
        function formatMoney(value) {
            return formatMoneyDisplay(value, false);
        }

        function addRow(data = {q: '', d: '', p: '', t: ''}) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-quant"><input type="text" inputmode="decimal" class="item-q" value="${data.q}"></td>
                <td class="col-desc"><input type="text" class="item-d" value="${data.d}"></td>
                <td class="col-preco"><input type="text" inputmode="decimal" class="item-p" value="${data.p}"></td>
                <td class="col-total"><input type="text" class="item-t" value="${data.t}" readonly></td>
            `;

            const qInput = tr.querySelector('.item-q');
            const pInput = tr.querySelector('.item-p');
            const dInput = tr.querySelector('.item-d');

            // Cálculo em tempo real a cada tecla digitada (input), não só ao sair do campo
            [qInput, pInput, dInput].forEach(inp => {
                inp.addEventListener('input', () => {
                    handleInput(tr);
                    saveDraft();
                });
            });

            // Ao perder o foco, formata o preço unitário bonito (9.999,99)
            pInput.addEventListener('blur', () => {
                const v = parseMoney(pInput.value);
                pInput.value = v > 0 ? formatMoney(v) : pInput.value;
            });

            tbody.appendChild(tr);
        }

        function handleInput(currentRow) {
            const qInput = currentRow.querySelector('.item-q');
            const pInput = currentRow.querySelector('.item-p');
            const tInput = currentRow.querySelector('.item-t');

            const q = parseMoney(qInput.value);
            const p = parseMoney(pInput.value);

            if (q > 0 && p > 0) {
                const totalLinha = q * p;
                tInput.value = formatMoney(totalLinha);
                tInput.classList.remove('pulsing');
                void tInput.offsetWidth; // reinicia animação
                tInput.classList.add('pulsing');
            } else {
                tInput.value = '';
            }

            const allRows = tbody.querySelectorAll('tr');
            const lastRow = allRows[allRows.length - 1];

            if (currentRow === lastRow) {
                let hasContent = Array.from(lastRow.querySelectorAll('input')).some(inp => inp.value.trim() !== '');
                if (hasContent) addRow();
            }

            calculateGrandTotal();
        }

        function calculateGrandTotal() {
            let total = 0;
            document.querySelectorAll('.item-t').forEach(input => {
                total += parseMoney(input.value);
            });
            renderTotalComAnimacao(total);
        }

        // Animação estilo "app financeiro": números sobem com leve blur
        let ultimoTotalExibido = null;
        function renderTotalComAnimacao(total) {
            const totalDiv = document.getElementById('total-geral');
            const textoFinal = `R$ ${formatMoney(total)}`;

            if (ultimoTotalExibido === textoFinal) return; // evita re-render sem mudança
            ultimoTotalExibido = textoFinal;

            totalDiv.innerHTML = `<span class="num-roll">${textoFinal}</span>`;
        }

        function gatherData() {
            const data = {
                pedido: document.getElementById('pedido-num').value,
                dataD: document.getElementById('data-d').value,
                dataM: document.getElementById('data-m').value,
                dataA: document.getElementById('data-a').value,
                cliente: {
                    nome: document.getElementById('cli-nome').value,
                    tel: document.getElementById('cli-tel').value,
                    end: document.getElementById('cli-end').value,
                    bairro: document.getElementById('cli-bairro').value,
                    mun: document.getElementById('cli-mun').value,
                    uf: document.getElementById('cli-uf').value,
                    cep: document.getElementById('cli-cep').value,
                },
                itens: []
            };

            tbody.querySelectorAll('tr').forEach(row => {
                const q = row.querySelector('.item-q').value;
                const d = row.querySelector('.item-d').value;
                const p = row.querySelector('.item-p').value;
                const t = row.querySelector('.item-t').value;
                if(q || d || p || t) data.itens.push({q, d, p, t});
            });
            return data;
        }

        function populateData(data) {
            document.getElementById('pedido-num').value = data.pedido || '';
            document.getElementById('data-d').value = data.dataD || '';
            document.getElementById('data-m').value = data.dataM || '';
            document.getElementById('data-a').value = data.dataA || '';

            document.getElementById('cli-nome').value = data.cliente?.nome || '';
            document.getElementById('cli-tel').value = data.cliente?.tel || '';
            document.getElementById('cli-end').value = data.cliente?.end || '';
            document.getElementById('cli-bairro').value = data.cliente?.bairro || '';
            document.getElementById('cli-mun').value = data.cliente?.mun || '';
            document.getElementById('cli-uf').value = data.cliente?.uf || '';
            document.getElementById('cli-cep').value = data.cliente?.cep || '';

            tbody.innerHTML = '';
            if(data.itens && data.itens.length > 0) {
                data.itens.forEach(item => addRow(item));
            }

            const currentRows = tbody.querySelectorAll('tr').length;
            for(let i = currentRows; i < MIN_ROWS; i++) addRow();
            addRow();

            ultimoTotalExibido = null;
            calculateGrandTotal();
        }

        function saveDraft() {
            localStorage.setItem('pedido_draft', JSON.stringify(gatherData()));
        }

        function salvarPedidoNomeado() {
            let nomeCliente = document.getElementById('cli-nome').value;
            let nomePadrao = nomeCliente ? `Pedido - ${nomeCliente}` : "Novo Pedido";

            let nome = prompt("Dê um nome para salvar este pedido:", nomePadrao);
            if (!nome) return;

            let savedOrders = JSON.parse(localStorage.getItem('pedidos_lista') || '[]');

            if(activeOrderId) {
                let index = savedOrders.findIndex(o => o.id === activeOrderId);
                if(index > -1) {
                    savedOrders[index].name = nome;
                    savedOrders[index].data = gatherData();
                }
            } else {
                activeOrderId = Date.now().toString();
                savedOrders.push({
                    id: activeOrderId,
                    name: nome,
                    data: gatherData()
                });
            }

            localStorage.setItem('pedidos_lista', JSON.stringify(savedOrders));
            renderSidebarList();
            alert("Pedido Salvo com sucesso!");
        }

        function loadOrder(id) {
            let savedOrders = JSON.parse(localStorage.getItem('pedidos_lista') || '[]');
            let order = savedOrders.find(o => o.id === id);
            if(order) {
                activeOrderId = order.id;
                populateData(order.data);
                saveDraft();
                closeSidebarMobile();
            }
        }

        function deleteOrder(id, event) {
            event.stopPropagation();
            if(confirm("Tem certeza que deseja apagar este pedido?")) {
                let savedOrders = JSON.parse(localStorage.getItem('pedidos_lista') || '[]');
                savedOrders = savedOrders.filter(o => o.id !== id);
                localStorage.setItem('pedidos_lista', JSON.stringify(savedOrders));

                if(activeOrderId === id) novoPedido();
                renderSidebarList();
            }
        }

        function novoPedido() {
            activeOrderId = null;
            populateData({});
            localStorage.removeItem('pedido_draft');
            closeSidebarMobile();
        }

        function renderSidebarList() {
            const listDiv = document.getElementById('order-list');
            listDiv.innerHTML = '';
            let savedOrders = JSON.parse(localStorage.getItem('pedidos_lista') || '[]');

            savedOrders.forEach(order => {
                const div = document.createElement('div');
                div.className = 'order-item';
                div.onclick = () => loadOrder(order.id);

                div.innerHTML = `
                    <span><i class="fas fa-file-alt"></i> ${order.name}</span>
                    <button class="delete-btn" onclick="deleteOrder('${order.id}', event)">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                listDiv.appendChild(div);
            });
        }

        // ------------------------------------------------------------
        // GERAÇÃO DE PDF — CORRIGIDA
        // Problema anterior: forçar width/height/windowWidth fixos em
        // pixels (2480x3508 / 595x842) junto com scale, fazia o
        // html2canvas capturar a página fora do tamanho real do
        // elemento, gerando corte/distorção ("PDF mal formado").
        // Agora deixamos o html2canvas medir o elemento real e
        // controlamos a qualidade só pelo "scale", com formato de
        // página A4 correto no jsPDF.
        // ------------------------------------------------------------
        function prepararCamposParaExport() {
            document.querySelectorAll('input').forEach(inp => {
                if (inp.type === 'checkbox') {
                    if (inp.checked) inp.setAttribute('checked', 'checked');
                    else inp.removeAttribute('checked');
                } else {
                    inp.setAttribute('value', inp.value);
                }
            });
        }

        function gerarPDF(scale, sufixo, qualidadeImagem, textoCarregando) {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('active');
            overlay.querySelector('.loading-text').textContent = textoCarregando;

            setTimeout(() => {
                const element = document.getElementById('folha-pedido');
                const nomeCli = (document.getElementById('cli-nome').value || 'Avulso').trim();

                prepararCamposParaExport();

                element.classList.add('pdf-mode');
                void element.offsetHeight;

                const opt = {
                    margin: 0,
                    filename: `WinPedidos7_${sufixo}_${nomeCli}.pdf`,
                    image: { type: 'jpeg', quality: qualidadeImagem },
                    html2canvas: {
                        scale: scale,
                        useCORS: true,
                        logging: false,
                        scrollX: 0,
                        scrollY: 0,
                        onclone: function(doc) {
                            doc.body.style.overflow = 'visible';
                        }
                    },
                    jsPDF: {
                        unit: 'mm',
                        format: 'a4',
                        orientation: 'portrait',
                        compress: true
                    },
                    pagebreak: { mode: ['avoid-all'] }
                };

                html2pdf()
                    .set(opt)
                    .from(element)
                    .save()
                    .then(() => {
                        element.classList.remove('pdf-mode');
                        overlay.classList.remove('active');
                        overlay.querySelector('.loading-text').textContent = 'Gerando documento...';
                    })
                    .catch((err) => {
                        console.error('Erro ao gerar PDF:', err);
                        element.classList.remove('pdf-mode');
                        overlay.classList.remove('active');
                        alert('Erro ao gerar PDF. Tente novamente.');
                        overlay.querySelector('.loading-text').textContent = 'Gerando documento...';
                    });
            }, 300);
        }

        function gerarPDFAltaQualidade() {
            gerarPDF(3.0, '300DPI', 0.98, 'Gerando PDF em alta qualidade...');
        }

        function gerarPDFBaixaQualidade() {
            gerarPDF(1.2, '72DPI', 0.75, 'Gerando PDF para visualização...');
        }

        function gerarPNG() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('active');
            overlay.querySelector('.loading-text').textContent = 'Gerando imagem PNG...';

            setTimeout(() => {
                const element = document.getElementById('folha-pedido');
                const nomeCli = (document.getElementById('cli-nome').value || 'Avulso').trim();

                prepararCamposParaExport();

                element.classList.add('pdf-mode');
                void element.offsetHeight;

                html2canvas(element, {
                    scale: 3.0,
                    useCORS: true,
                    logging: false,
                    scrollX: 0,
                    scrollY: 0,
                    onclone: function(doc) {
                        doc.body.style.overflow = 'visible';
                    }
                }).then(canvas => {
                    element.classList.remove('pdf-mode');
                    overlay.classList.remove('active');
                    overlay.querySelector('.loading-text').textContent = 'Gerando documento...';

                    const link = document.createElement('a');
                    link.download = `WinPedidos7_${nomeCli}.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    link.click();
                }).catch((err) => {
                    console.error('Erro ao gerar PNG:', err);
                    element.classList.remove('pdf-mode');
                    overlay.classList.remove('active');
                    alert('Erro ao gerar PNG. Tente novamente.');
                    overlay.querySelector('.loading-text').textContent = 'Gerando documento...';
                });
            }, 300);
        }

        window.onload = () => {
            renderSidebarList();
            const draft = localStorage.getItem('pedido_draft');
            if (draft) {
                populateData(JSON.parse(draft));
            } else {
                populateData({});
            }
        };
    </script>
