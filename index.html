        function aguardarRecursosProntos() {
            const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
            const imgs = Array.from(document.images || []);
            const imgsReady = Promise.all(imgs.map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(resolve => {
                    img.addEventListener('load', resolve, { once: true });
                    img.addEventListener('error', resolve, { once: true });
                });
            }));
            return Promise.race([
                Promise.all([fontsReady, imgsReady]),
                new Promise(resolve => setTimeout(resolve, 1500))
            ]);
        }

        const esperar = ms => new Promise(r => setTimeout(r, ms));
        const proximoFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));

        function setOverlayTexto(txt) {
            const el = document.querySelector('#loadingOverlay .loading-text');
            if (el) el.textContent = txt;
        }

        function nomeArquivo(sufixo, ext) {
            const limpa = s => (s || '').trim().replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_');
            const nome = limpa(document.getElementById('cli-nome').value) || 'Avulso';
            const num = limpa(document.getElementById('pedido-num').value);
            return `WinPedidos7_${sufixo ? sufixo + '_' : ''}${num ? num + '_' : ''}${nome}.${ext}`;
        }

        // Evita estourar o limite de canvas (principalmente iOS/Android)
        function escalaSegura(scale) {
            const itens = gatherData().itens.length;
            const paginas = Math.max(1, Math.ceil((itens + 1) / 20));
            const hEst = 1123 * paginas * 1.15;
            const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            const maxArea = touch ? 14e6 : 80e6;
            return Math.max(1, Math.min(scale, Math.sqrt(maxArea / (EXPORT_W * hEst))));
        }

        /**
         * Ajusta o DOCUMENTO CLONADO (nunca a tela do usuário):
         *  - força layout de papel A4 (mesmo no celular, sem o layout "cartão")
         *  - aumenta a fonte
         *  - remove linhas vazias do fim se isso evitar uma página extra
         *  - registra os pontos seguros de quebra de página (entre linhas)
         */
        function prepararClone(doc, breaks, opts = {}) {
            const fator = opts.fator || PDF_FONT_FACTOR;
            const el = doc.getElementById('folha-pedido');
            if (!el) return;
            const win = doc.defaultView;

            const imp = (n, prop, val) => n.style.setProperty(prop, val, 'important');

            // 1. ancestrais: sem overflow escondido, sem centralização que corta o topo
            for (let n = el.parentElement; n; n = n.parentElement) {
                imp(n, 'overflow', 'visible');
                imp(n, 'height', 'auto');
                imp(n, 'min-height', '0');
                imp(n, 'max-height', 'none');
                imp(n, 'transform', 'none');
                imp(n, 'display', 'block');
                imp(n, 'align-items', 'normal');
                imp(n, 'justify-content', 'flex-start');
                if (n !== doc.documentElement && n !== doc.body) imp(n, 'position', 'static');
            }

            // 2. folha: largura A4 e ALTURA LIVRE (fonte maior = folha mais alta, nada cortado)
            imp(el, 'width', EXPORT_W + 'px');
            imp(el, 'max-width', 'none');
            imp(el, 'min-width', '0');
            imp(el, 'margin', '0');
            imp(el, 'zoom', '1');
            imp(el, 'transform', 'none');
            imp(el, 'top', '0'); imp(el, 'left', '0');
            imp(el, 'height', 'auto');
            imp(el, 'max-height', 'none');
            imp(el, 'overflow', 'visible');
            el.querySelectorAll('.border-box, .items-section, .footer-section, .footer-right, .footer-left, .header-section, .flex-row, .col, .pedido-box, .data-box, .data-inputs, table, thead, tbody, tr, th, td, .label, .total-label').forEach(n => {
                imp(n, 'overflow', 'visible');
                imp(n, 'text-overflow', 'clip');
                imp(n, 'max-height', 'none');
            });
            ['.border-box', '.items-section', '.footer-section', '.footer-right'].forEach(sel => {
                const n = el.querySelector(sel);
                if (n) { imp(n, 'height', 'auto'); }
            });

            // 3. aumenta a fonte (lê tudo primeiro, escreve depois). !important vence o CSS do tema
            const todos = [el, ...el.querySelectorAll('*')];
            const info = todos.map(n => {
                const cs = win.getComputedStyle(n);
                return {
                    n,
                    fs: parseFloat(cs.fontSize) || 0,
                    h: n.tagName === 'INPUT' ? parseFloat(cs.height) || 0 : 0
                };
            });
            const fatorAltura = 1 + (fator - 1) * 0.6;
            info.forEach(({ n, fs, h }) => {
                if (fs) imp(n, 'font-size', (fs * fator) + 'px');
                if (h) imp(n, 'height', Math.max(h * fatorAltura, fs * fator * 1.6) + 'px');
            });

            // total geral: nunca cortar o valor
            const tv = el.querySelector('.total-value');
            if (tv) {
                const num = tv.querySelector('.num-roll');
                imp(tv, 'overflow', 'visible');
                imp(tv, 'width', 'auto');
                imp(tv, 'min-width', '0');
                imp(tv, 'max-width', 'none');
                imp(tv, 'height', 'auto');
                imp(tv, 'white-space', 'nowrap');
                imp(tv, 'line-height', '1.35');
                imp(tv, 'text-overflow', 'clip');
                imp(tv, 'padding-bottom', '2px');
                if (num) { imp(num, 'transform', 'none'); imp(num, 'opacity', '1'); imp(num, 'filter', 'none'); }
            }
            const fr = el.querySelector('.footer-right');
            if (fr) { imp(fr, 'flex-wrap', 'wrap'); imp(fr, 'justify-content', 'flex-end'); imp(fr, 'width', 'auto'); imp(fr, 'max-width', '100%'); }
            const fs2 = el.querySelector('.footer-section');
            if (fs2) { imp(fs2, 'flex-wrap', 'wrap'); }

            // 4. texto maior que o campo: reduz um pouco; se ainda não couber, quebra em várias linhas
            el.querySelectorAll('input').forEach(inp => {
                let s = parseFloat(inp.style.fontSize);
                if (!s) return;
                const min = (s / fator) * 0.95;
                let guard = 0;
                while (inp.scrollWidth > inp.clientWidth + 1 && s > min && guard++ < 24) {
                    s -= 0.5;
                    imp(inp, 'font-size', s + 'px');
                }
                if (inp.scrollWidth > inp.clientWidth + 1 && inp.value.trim()) {
                    const cs = win.getComputedStyle(inp);
                    const div = doc.createElement('div');
                    div.className = inp.className;
                    div.textContent = inp.value;
                    const css = {
                        'box-sizing': 'border-box', 'width': '100%', 'height': 'auto',
                        'font-family': cs.fontFamily, 'font-weight': cs.fontWeight, 'font-size': cs.fontSize,
                        'color': cs.color, 'text-align': cs.textAlign, 'padding': cs.padding,
                        'background': cs.backgroundColor, 'border': cs.border,
                        'white-space': 'normal', 'word-break': 'break-word', 'line-height': '1.25'
                    };
                    Object.keys(css).forEach(k => imp(div, k, css[k]));
                    inp.replaceWith(div);
                }
            });

            if (opts.paginar === false) return;

            // 5. remove linhas vazias do final se isso evitar uma página extra
            const alturaA4 = () => el.getBoundingClientRect().width * 297 / 210;
            const vazia = tr => Array.from(tr.querySelectorAll('input')).every(i => !i.value.trim());
            let linhas = Array.from(el.querySelectorAll('#items-body tr'));
            while (linhas.length > 1 && el.getBoundingClientRect().height > alturaA4() && vazia(linhas[linhas.length - 1])) {
                linhas.pop().remove();
            }

            // 6. pontos de quebra seguros (fim de cada linha, em px CSS relativos ao topo)
            const topo = el.getBoundingClientRect().top;
            linhas.forEach(tr => breaks.push(tr.getBoundingClientRect().bottom - topo));
        }

        async function capturarFolha(scale) {
            const element = document.getElementById('folha-pedido');
            const breaks = [];
            const canvas = await html2canvas(element, {
                scale,
                useCORS: true,
                allowTaint: false,
                logging: false,
                scrollX: 0,
                scrollY: 0,
                windowWidth: 1200,                         // >768px: nunca usa o layout de celular
                windowHeight: Math.max(window.innerHeight, 3000),
                backgroundColor: '#ffffff',
                onclone: doc => prepararClone(doc, breaks)
            });
            return { canvas, breaks, scale };
        }

        async function renderComRetry(scaleDesejada) {
            let s = escalaSegura(scaleDesejada);
            let ultimoErro = null;
            for (let i = 0; i < 3; i++) {
                try {
                    const r = await capturarFolha(s);
                    if (r.canvas.width > 0 && r.canvas.height > 0) return r;
                } catch (e) { ultimoErro = e; }
                s = Math.max(1, s * 0.75);
                setOverlayTexto('Ajustando qualidade para o aparelho...');
                await proximoFrame();
            }
            throw ultimoErro || new Error('Canvas vazio');
        }

        async function comOverlay(texto, tarefa) {
            if (exporting) return;
            exporting = true;
            document.body.classList.add('exporting');
            const overlay = document.getElementById('loadingOverlay');
            const element = document.getElementById('folha-pedido');
            setOverlayTexto(texto);
            overlay.classList.add('active');
            try {
                if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                if (draftTimer) persistDraft();
                await proximoFrame();
                await aguardarRecursosProntos();
                await esperar(250);
                prepararCamposParaExport();
                element.classList.add('pdf-mode');
                void element.offsetHeight;
                await tarefa();
            } catch (err) {
                console.error('Erro na exportação:', err);
                toast('Erro ao gerar o arquivo. Tente novamente ou feche outros apps para liberar memória.', 'error', 5500);
            } finally {
                element.classList.remove('pdf-mode');
                overlay.classList.remove('active');
                setOverlayTexto('Gerando documento...');
                document.body.classList.remove('exporting');
                exporting = false;
            }
        }

        async function gerarPDFCompleto(scale, qualidade, sufixo, texto) {
            await comOverlay(texto, async () => {
                const r = await renderComRetry(scale);
                setOverlayTexto('Montando PDF...');
                await proximoFrame();

                const JsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
                if (!JsPDF) throw new Error('jsPDF não carregou (verifique a conexão).');

                const pdf = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
                const pdfL = pdf.internal.pageSize.getWidth();
                const pdfA = pdf.internal.pageSize.getHeight();
                const { canvas, breaks } = r;

                // Pagina SEM cortar linhas ao meio
                const paginaPx = Math.floor(canvas.width * pdfA / pdfL);
                const quebras = breaks.map(b => Math.round(b * r.scale)).sort((a, b) => a - b);
                const cortes = [];
                let ini = 0;
                while (ini < canvas.height - 2) {
                    let fim = ini + paginaPx;
                    if (fim >= canvas.height) {
                        fim = canvas.height;
                    } else {
                        const cand = quebras.filter(b => b > ini + paginaPx * 0.5 && b <= fim);
                        if (cand.length) fim = cand[cand.length - 1];
                    }
                    cortes.push([ini, fim]);
                    ini = fim;
                }

                cortes.forEach(([y0, y1], idx) => {
                    if (idx > 0) pdf.addPage();
                    const alt = y1 - y0;
                    const fatia = document.createElement('canvas');
                    fatia.width = canvas.width;
                    fatia.height = alt;
                    const ctx = fatia.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, fatia.width, fatia.height);
                    ctx.drawImage(canvas, 0, y0, canvas.width, alt, 0, 0, canvas.width, alt);
                    pdf.addImage(fatia.toDataURL('image/jpeg', qualidade), 'JPEG', 0, 0, pdfL, (alt * pdfL) / canvas.width, undefined, 'FAST');
                    fatia.width = fatia.height = 0;
                });
                canvas.width = canvas.height = 0;

                pdf.save(nomeArquivo(sufixo, 'pdf'));
                toast(cortes.length > 1 ? `PDF gerado (${cortes.length} páginas)` : 'PDF gerado!', 'success');
            });
        }

        function gerarPDFAltaQualidade() {
            gerarPDFCompleto(3.0, 0.98, '300DPI', 'Gerando PDF em alta qualidade...');
        }

        function gerarPDFBaixaQualidade() {
            gerarPDFCompleto(1.5, 0.8, '72DPI', 'Gerando PDF para visualização...');
        }

        // ---------- PNG com html-to-image (renderização nativa do navegador) ----------
        function carregarScriptEm(doc, src, timeout = 15000) {
            return new Promise((resolve, reject) => {
                const s = doc.createElement('script');
                const t = setTimeout(() => reject(new Error('Tempo esgotado ao carregar html-to-image')), timeout);
                s.onload = () => { clearTimeout(t); resolve(); };
                s.onerror = () => { clearTimeout(t); reject(new Error('Falha ao carregar html-to-image')); };
                s.src = src;
                doc.head.appendChild(s);
            });
        }

        // Cria um iframe invisível de 1200px (layout de PC, nunca o de celular) com uma cópia da folha
        async function criarSandbox() {
            const iframe = document.createElement('iframe');
            iframe.setAttribute('aria-hidden', 'true');
            iframe.tabIndex = -1;
            iframe.style.cssText = 'position:fixed;left:-20000px;top:0;width:1200px;height:3000px;border:0;opacity:0;pointer-events:none;';
            document.body.appendChild(iframe);

            const d = iframe.contentDocument;
            d.open();
            d.write('<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"></head><body></body></html>');
            d.close();

            // copia TODOS os estilos da página (inclusive o CSS dinâmico por dispositivo)
            const pend = [];
            document.querySelectorAll('link[rel~="stylesheet"], style').forEach(n => {
                const c = n.cloneNode(true);
                if (n.tagName === 'LINK') {
                    c.href = n.href;
                    try { if (new URL(n.href, location.href).origin !== location.origin) c.crossOrigin = 'anonymous'; } catch (e) {}
                    pend.push(new Promise(r => { c.onload = r; c.onerror = r; }));
                }
                d.head.appendChild(c);
            });
            await Promise.race([Promise.all(pend), esperar(6000)]);

            d.body.className = document.body.className.replace(/\b(exporting|is-fullscreen|show-bar)\b/g, '').trim();
            d.documentElement.style.height = 'auto';
            d.body.style.cssText = 'height:auto;min-height:0;overflow:visible;margin:0;';

            const main = d.createElement('main');
            main.className = 'main-area';
            main.style.cssText = 'height:auto;min-height:0;overflow:visible;width:auto;margin:0;';
            const paper = d.createElement('div');
            paper.className = 'paper-container';
            paper.style.cssText = 'height:auto;min-height:0;max-height:none;overflow:visible;padding:0;margin:0;';
            const clone = document.getElementById('folha-pedido').cloneNode(true);
            clone.classList.add('pdf-mode');
            paper.appendChild(clone);
            main.appendChild(paper);
            d.body.appendChild(main);

            try { await Promise.race([d.fonts.ready, esperar(3000)]); } catch (e) {}
            try { await d.fonts.load('900 1em "Font Awesome 6 Free"'); } catch (e) {}
            await esperar(250);
            return iframe;
        }

        async function capturarPNGHtmlToImage() {
            const iframe = await criarSandbox();
            try {
                const d = iframe.contentDocument;
                prepararClone(d, null, { fator: PNG_FONT_FACTOR, paginar: false });
                await carregarScriptEm(d, HTI_URL);
                const hti = iframe.contentWindow.htmlToImage;
                if (!hti) throw new Error('html-to-image indisponível');

                const el = d.getElementById('folha-pedido');
                const rect = el.getBoundingClientRect();
                const W = Math.ceil(Math.max(rect.width, el.scrollWidth));
                const H = Math.ceil(Math.max(rect.height, el.scrollHeight)) + 2;

                // limita a resolução para o aparelho aguentar
                const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
                const maxArea = touch ? 14e6 : 80e6;
                const ratio = Math.max(1, Math.min(3, Math.sqrt(maxArea / (W * H)), 16000 / Math.max(W, H)));

                const opts = { pixelRatio: ratio, backgroundColor: '#ffffff', cacheBust: true, width: W, height: H, style: { margin: '0', transform: 'none' } };
                setOverlayTexto('Renderizando imagem...');
                await proximoFrame();
                try { await hti.toCanvas(el, { ...opts, pixelRatio: 1 }); } catch (e) {}   // aquece fontes/ícones
                const blob = await hti.toBlob(el, opts);
                if (!blob || blob.size < 8000) throw new Error('Imagem vazia');
                return blob;
            } finally {
                iframe.remove();
            }
        }

        // Plano B: html2canvas (caso o html-to-image não carregue, p.ex. sem internet)
        async function capturarPNGHtml2Canvas() {
            const element = document.getElementById('folha-pedido');
            const canvas = await html2canvas(element, {
                scale: escalaSegura(3.0),
                useCORS: true, allowTaint: false, logging: false,
                scrollX: 0, scrollY: 0,
                windowWidth: 1200, windowHeight: Math.max(window.innerHeight, 3000),
                backgroundColor: '#ffffff',
                onclone: doc => prepararClone(doc, [], { fator: PNG_FONT_FACTOR, paginar: false })
            });
            const blob = await new Promise(res => canvas.toBlob(res, 'image/png', 1.0));
            canvas.width = canvas.height = 0;
            return blob;
        }

        async function gerarPNG() {
            await comOverlay('Gerando imagem PNG...', async () => {
                let blob = null;
                try {
                    blob = await capturarPNGHtmlToImage();
                } catch (e) {
                    console.warn('html-to-image falhou, usando plano B:', e);
                    setOverlayTexto('Usando modo alternativo...');
                    await proximoFrame();
                    blob = await capturarPNGHtml2Canvas();
                }
                if (!blob) throw new Error('Falha ao criar PNG');
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = nomeArquivo('', 'png');
                link.href = url;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 4000);
                toast('Imagem PNG gerada!', 'success');
            });
        }

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        function init() {
            setupSidebarSearch();
            setupMasks();
            setupKeyboard();
            setupSidebarGestures();
            setupFloatTotal();
            syncFullscreenUI(false);

            const lista = lsGet(STORE.list, []);
            const ativo = lsGet(STORE.active, null);
            activeOrderId = lista.some(o => o.id === ativo) ? ativo : null;

            const draft = lsGet(STORE.draft, null);
            if (draft && typeof draft === 'object') {
                populateData(draft);
            } else {
                populateData({});
                setDefaultDate();
            }
            renderSidebarList();
            animarLinhas = true;
        }

        init();
        logVersao();
    </script>
