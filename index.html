<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerenciador de Pedidos</title>
    <!-- Biblioteca para gerar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --bg-color: #e0e0e0;
            --sidebar-width: 250px;
            --topbar-height: 60px;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* BARRA LATERAL (SIDEBAR) */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
            font-weight: bold;
            font-size: 18px;
        }

        .order-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .order-item {
            background: #333;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .order-item:hover { background: #444; }
        .order-item span { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px;}
        .delete-btn { background: #ff4444; border: none; color: white; border-radius: 3px; padding: 4px 8px; cursor: pointer; font-weight: bold;}

        /* ÁREA PRINCIPAL */
        .main-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: calc(100% - var(--sidebar-width));
        }

        /* BARRA SUPERIOR DE BOTÕES */
        .topbar {
            height: var(--topbar-height);
            background: white;
            border-bottom: 2px solid #ccc;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .btn {
            padding: 8px 15px;
            border: 2px solid black;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn:hover { background: black; color: white; }
        
        .menu-toggle { display: none; }

        /* CONTAINER DO PAPEL (SCROLL) */
        .paper-container {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* O PAPEL EM SI */
        .page {
            background-color: white;
            width: 800px;
            min-width: 800px;
            border: 3px solid black;
            padding: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
            /* Permite crescer conforme as linhas são adicionadas */
            min-height: 1000px; 
        }

        .border-box {
            border: 2px solid black;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            height: 100%;
        }

        .flex-row { display: flex; border-bottom: 2px solid black; }
        .col { border-right: 2px solid black; padding: 4px; display: flex; align-items: center; }
        .col:last-child { border-right: none; }
        
        .label { font-weight: bold; font-size: 11px; margin-right: 5px; white-space: nowrap; text-transform: uppercase; }
        
        input[type="text"], input[type="number"] {
            border: none; outline: none; width: 100%; font-size: 14px; background: transparent; font-family: monospace;
        }

        /* Cabeçalho */
        .header-section { display: flex; justify-content: space-between; padding: 10px; border-bottom: 2px solid black; }
        .pedido-box { border: 3px solid black; border-radius: 5px; padding: 5px 10px; display: flex; align-items: center; width: 60%; }
        .pedido-box .label { font-size: 22px; margin-right: 10px; font-weight: 900;}
        .pedido-box input { font-size: 22px; font-weight: bold; }
        .data-box { border: 2px solid black; border-radius: 5px; padding: 5px; display: flex; align-items: flex-start; width: 35%; }
        .data-inputs { display: flex; align-items: flex-end; justify-content: space-around; width: 100%; margin-top: 15px;}
        .data-inputs input { width: 30%; text-align: center; border-bottom: 1px solid black; }
        .data-inputs span { font-size: 20px; font-weight: bold;}

        /* Tabela */
        .items-section { flex-grow: 1; display: flex; flex-direction: column; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-right: 2px solid black; border-bottom: 1px solid black; padding: 5px; }
        th:last-child, td:last-child { border-right: none; }
        tr:last-child td { border-bottom: 2px solid black; }
        th { font-size: 14px; font-weight: 900; text-transform: uppercase; border-bottom: 2px solid black; }
        .col-quant { width: 10%; text-align: center; }
        .col-desc { width: 60%; }
        .col-preco { width: 15%; text-align: center; }
        .col-total { width: 15%; text-align: center; }
        td input { text-align: center; }
        td.col-desc input { text-align: left; }

        /* Rodapé */
        .footer-section { display: flex; justify-content: space-between; padding: 10px; }
        .footer-left { display: flex; flex-direction: column; justify-content: space-around; width: 60%;}
        .footer-row { display: flex; align-items: center; margin-bottom: 5px;}
        .footer-row input[type="text"] { border-bottom: 1px solid black; width: 150px; margin-left: 5px;}
        input[type="checkbox"] { margin: 0 5px; appearance: none; width: 18px; height: 18px; border: 2px solid black; cursor: pointer; }
        input[type="checkbox"]:checked { background-color: black; }
        .footer-right { display: flex; align-items: flex-end; justify-content: flex-end; width: 40%; }
        .total-label { font-size: 24px; font-weight: 900; margin-right: 10px; }
        .total-value { border-bottom: 2px solid black; width: 150px; font-size: 20px; font-weight: bold; text-align: right; min-height: 25px;}

        /* MOBILE RESPONSIVO */
        @media (max-width: 768px) {
            .sidebar { position: absolute; left: -100%; height: 100%; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            .sidebar.active { left: 0; }
            .main-area { width: 100%; }
            .menu-toggle { display: block; }
            .topbar { padding: 0 10px; justify-content: space-between; gap: 5px; overflow-x: auto; }
            .topbar-actions { display: flex; gap: 5px; }
            .btn { font-size: 11px; padding: 6px 8px; }
            .paper-container { padding: 10px; }

            .page:not(.pdf-mode) { width: 100%; min-width: 100%; min-height: auto; padding: 5px; border: none; box-shadow: none; }
            .page:not(.pdf-mode) .border-box { border: none; }
            .page:not(.pdf-mode) .header-section { flex-direction: column; border-bottom: none; gap: 10px; padding: 0; margin-bottom: 10px; }
            .page:not(.pdf-mode) .pedido-box { width: 100%; }
            .page:not(.pdf-mode) .data-box { width: 100%; }
            
            .page:not(.pdf-mode) .flex-row { flex-direction: column; border-bottom: none; gap: 5px; margin-bottom: 5px; }
            .page:not(.pdf-mode) .col { width: 100% !important; border: 1px solid #aaa; border-radius: 5px; padding: 8px; background: #fff; }
            
            .page:not(.pdf-mode) input[type="text"] { border-bottom: 1px solid #ddd; padding-bottom: 3px; font-size: 16px; }

            .page:not(.pdf-mode) .items-section { overflow-x: auto; border: 1px solid #aaa; border-radius: 5px; margin-top: 10px; }
            .page:not(.pdf-mode) table { min-width: 600px; } 

            .page:not(.pdf-mode) .footer-section { flex-direction: column; gap: 15px; padding: 10px 0; }
            .page:not(.pdf-mode) .footer-left { width: 100%; }
            .page:not(.pdf-mode) .footer-right { width: 100%; justify-content: space-between; border-top: 2px solid black; padding-top: 10px;}
        }

        /* ESTILOS FORÇADOS PARA PDF */
        .pdf-mode {
            width: 800px !important;
            min-width: 800px !important;
            padding: 10px !important;
            border: 3px solid black !important;
            background: white !important;
        }
    </style>
</head>
<body>

    <!-- BARRA LATERAL -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            Pedidos Salvos
        </div>
        <div class="order-list" id="order-list">
            <!-- Itens carregados via JS -->
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-area">
        <!-- Barra de Ferramentas -->
        <div class="topbar">
            <button class="btn menu-toggle" onclick="toggleSidebar()">☰ Menu</button>
            <div class="topbar-actions">
                <button class="btn" onclick="novoPedido()">+ Novo</button>
                <button class="btn" onclick="salvarPedidoNomeado()">Salvar na Lista</button>
                <button class="btn" onclick="gerarPDF()" style="background:#000; color:#fff;">Gerar PDF</button>
            </div>
        </div>

        <!-- Área do Papel -->
        <div class="paper-container" onclick="closeSidebarMobile()">
            <div class="page" id="folha-pedido">
                <div class="border-box">
                    
                    <!-- Cabeçalho -->
                    <div class="header-section">
                        <div class="pedido-box">
                            <span class="label">PEDIDO Nº</span>
                            <input type="text" id="pedido-num" oninput="saveDraft()">
                        </div>
                        <div class="data-box">
                            <span class="label">DATA</span>
                            <div class="data-inputs">
                                <input type="text" id="data-d" maxlength="2" oninput="saveDraft()"> <span>/</span>
                                <input type="text" id="data-m" maxlength="2" oninput="saveDraft()"> <span>/</span>
                                <input type="text" id="data-a" maxlength="4" oninput="saveDraft()">
                            </div>
                        </div>
                    </div>

                    <!-- Dados Cliente -->
                    <div class="flex-row">
                        <div class="col" style="width: 70%;"><span class="label">NOME:</span><input type="text" id="cli-nome" oninput="saveDraft()"></div>
                        <div class="col" style="width: 30%;"><span class="label">TEL:</span><input type="text" id="cli-tel" oninput="saveDraft()"></div>
                    </div>
                    <div class="flex-row">
                        <div class="col" style="width: 70%;"><span class="label">ENDEREÇO:</span><input type="text" id="cli-end" oninput="saveDraft()"></div>
                        <div class="col" style="width: 30%;"><span class="label">BAIRRO:</span><input type="text" id="cli-bairro" oninput="saveDraft()"></div>
                    </div>
                    <div class="flex-row">
                        <div class="col" style="width: 60%;"><span class="label">MUNICIPIO:</span><input type="text" id="cli-mun" oninput="saveDraft()"></div>
                        <div class="col" style="width: 15%;"><span class="label">UF</span><input type="text" id="cli-uf" maxlength="2" style="text-align:center;" oninput="saveDraft()"></div>
                        <div class="col" style="width: 25%;"><span class="label">CEP</span><input type="text" id="cli-cep" oninput="saveDraft()"></div>
                    </div>
                    <div class="flex-row">
                        <div class="col" style="width: 55%;"><span class="label">CNPJ/CPF</span><input type="text" id="cli-doc" oninput="saveDraft()"></div>
                        <div class="col" style="width: 45%;"><span class="label">INSC.ESTADUAL</span><input type="text" id="cli-ie" oninput="saveDraft()"></div>
                    </div>

                    <!-- Tabela de Itens -->
                    <div class="items-section">
                        <table>
                            <thead>
                                <tr>
                                    <th class="col-quant">QUANT.</th>
                                    <th class="col-desc">DESCRIÇÃO</th>
                                    <th class="col-preco">PREÇO<br>UNT.</th>
                                    <th class="col-total">TOTAL</th>
                                </tr>
                            </thead>
                            <tbody id="items-body">
                                <!-- Linhas geradas via JS -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Rodapé -->
                    <div class="footer-section">
                        <div class="footer-left">
                            <div class="footer-row">
                                <span class="label">PRAZO</span>
                                <input type="checkbox" id="prazo-15" onchange="saveDraft()"> <span class="label">15 DIAS</span>
                                <input type="checkbox" id="prazo-30" onchange="saveDraft()"> <span class="label">30 DIAS</span>
                            </div>
                            <div class="footer-row">
                                <span class="label">CHEQUE VALOR R$</span><input type="text" id="val-cheque" oninput="saveDraft()">
                            </div>
                            <div class="footer-row">
                                <span class="label">SINAL R$</span><input type="text" id="val-sinal" oninput="saveDraft()">
                            </div>
                        </div>
                        <div class="footer-right">
                            <span class="total-label">TOTAL R$:</span>
                            <div class="total-value" id="total-geral"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script>
        const tbody = document.getElementById('items-body');
        const MIN_ROWS = 15;
        let activeOrderId = null; 

        // --- SISTEMA DE UI ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }
        function closeSidebarMobile() {
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('active');
            }
        }

        // --- UTILITÁRIOS DE MATEMÁTICA ---
        const formatMoney = (value) => {
            if(isNaN(value) || value === '') return '';
            return parseFloat(value).toFixed(2).replace('.', ',');
        }

        const parseMoney = (str) => {
            if(!str) return 0;
            return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
        }

        // --- LÓGICA DA TABELA ---
        function addRow(data = {q: '', d: '', p: '', t: ''}) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-quant"><input type="text" class="item-q" value="${data.q}"></td>
                <td class="col-desc"><input type="text" class="item-d" value="${data.d}"></td>
                <td class="col-preco"><input type="text" class="item-p" value="${data.p}"></td>
                <td class="col-total"><input type="text" class="item-t" value="${data.t}"></td>
            `;

            tr.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', () => {
                    handleInput(tr);
                    saveDraft();
                });
            });
            tbody.appendChild(tr);
        }

        function handleInput(currentRow) {
            const qInput = currentRow.querySelector('.item-q');
            const pInput = currentRow.querySelector('.item-p');
            const tInput = currentRow.querySelector('.item-t');

            const q = parseMoney(qInput.value);
            const p = parseMoney(pInput.value);
            
            if(q > 0 && p > 0 && !isNaN(q) && !isNaN(p)) {
                tInput.value = formatMoney(q * p);
            } else if (qInput.value === '' || pInput.value === '') {
                tInput.value = '';
            }

            const allRows = tbody.querySelectorAll('tr');
            const lastRow = allRows[allRows.length - 1];
            
            // REMOVIDO O LIMITE: Agora adiciona linha infinitamente se a última for preenchida
            if (currentRow === lastRow) {
                let hasContent = Array.from(lastRow.querySelectorAll('input')).some(inp => inp.value.trim() !== '');
                if (hasContent) addRow(); 
            }

            calculateGrandTotal();
        }

        function calculateGrandTotal() {
            let total = 0;
            document.querySelectorAll('.item-t').forEach(input => {
                total += parseMoney(input.value);
            });
            const totalDiv = document.getElementById('total-geral');
            totalDiv.innerText = total > 0 ? formatMoney(total) : '';
        }

        function gatherData() {
            const data = {
                pedido: document.getElementById('pedido-num').value,
                dataD: document.getElementById('data-d').value,
                dataM: document.getElementById('data-m').value,
                dataA: document.getElementById('data-a').value,
                cliente: {
                    nome: document.getElementById('cli-nome').value,
                    tel: document.getElementById('cli-tel').value,
                    end: document.getElementById('cli-end').value,
                    bairro: document.getElementById('cli-bairro').value,
                    mun: document.getElementById('cli-mun').value,
                    uf: document.getElementById('cli-uf').value,
                    cep: document.getElementById('cli-cep').value,
                    doc: document.getElementById('cli-doc').value,
                    ie: document.getElementById('cli-ie').value,
                },
                rodape: {
                    p15: document.getElementById('prazo-15').checked,
                    p30: document.getElementById('prazo-30').checked,
                    cheque: document.getElementById('val-cheque').value,
                    sinal: document.getElementById('val-sinal').value
                },
                itens: []
            };

            tbody.querySelectorAll('tr').forEach(row => {
                const q = row.querySelector('.item-q').value;
                const d = row.querySelector('.item-d').value;
                const p = row.querySelector('.item-p').value;
                const t = row.querySelector('.item-t').value;
                if(q || d || p || t) data.itens.push({q, d, p, t});
            });
            return data;
        }

        function populateData(data) {
            document.getElementById('pedido-num').value = data.pedido || '';
            document.getElementById('data-d').value = data.dataD || '';
            document.getElementById('data-m').value = data.dataM || '';
            document.getElementById('data-a').value = data.dataA || '';
            
            document.getElementById('cli-nome').value = data.cliente?.nome || '';
            document.getElementById('cli-tel').value = data.cliente?.tel || '';
            document.getElementById('cli-end').value = data.cliente?.end || '';
            document.getElementById('cli-bairro').value = data.cliente?.bairro || '';
            document.getElementById('cli-mun').value = data.cliente?.mun || '';
            document.getElementById('cli-uf').value = data.cliente?.uf || '';
            document.getElementById('cli-cep').value = data.cliente?.cep || '';
            document.getElementById('cli-doc').value = data.cliente?.doc || '';
            document.getElementById('cli-ie').value = data.cliente?.ie || '';

            document.getElementById('prazo-15').checked = data.rodape?.p15 || false;
            document.getElementById('prazo-30').checked = data.rodape?.p30 || false;
            document.getElementById('val-cheque').value = data.rodape?.cheque || '';
            document.getElementById('val-sinal').value = data.rodape?.sinal || '';

            tbody.innerHTML = ''; 
            if(data.itens && data.itens.length > 0) {
                data.itens.forEach(item => addRow(item));
            }
            
            const currentRows = tbody.querySelectorAll('tr').length;
            for(let i = currentRows; i < MIN_ROWS; i++) addRow();
            addRow(); 

            calculateGrandTotal();
        }

        function saveDraft() {
            localStorage.setItem('pedido_draft', JSON.stringify(gatherData()));
        }

        function salvarPedidoNomeado() {
            let nomeCliente = document.getElementById('cli-nome').value;
            let nomePadrao = nomeCliente ? `Pedido - ${nomeCliente}` : "Novo Pedido";
            
            let nome = prompt("Dê um nome para salvar este pedido:", nomePadrao);
            if (!nome) return; 

            let savedOrders = JSON.parse(localStorage.getItem('pedidos_lista') || '[]');
            
            if(activeOrderId) {
                let index = savedOrders.findIndex(o => o.id === activeOrderId);
                if(index > -1) {
                    savedOrders[index].name = nome;
                    savedOrders[index].data = gatherData();
                }
            } else {
                activeOrderId = Date.now().toString();
                savedOrders.push({
                    id: activeOrderId,
                    name: nome,
                    data: gatherData()
                });
            }

            localStorage.setItem('pedidos_lista', JSON.stringify(savedOrders));
            renderSidebarList();
            alert("Pedido Salvo com sucesso!");
        }

        function loadOrder(id) {
            let savedOrders = JSON.parse(localStorage.getItem('pedidos_lista') || '[]');
            let order = savedOrders.find(o => o.id === id);
            if(order) {
                activeOrderId = order.id;
                populateData(order.data);
                saveDraft(); 
                closeSidebarMobile();
            }
        }

        function deleteOrder(id, event) {
            event.stopPropagation();
            if(confirm("Tem certeza que deseja apagar este pedido?")) {
                let savedOrders = JSON.parse(localStorage.getItem('pedidos_lista') || '[]');
                savedOrders = savedOrders.filter(o => o.id !== id);
                localStorage.setItem('pedidos_lista', JSON.stringify(savedOrders));
                
                if(activeOrderId === id) novoPedido();
                renderSidebarList();
            }
        }

        function novoPedido() {
            activeOrderId = null;
            populateData({});
            localStorage.removeItem('pedido_draft');
            closeSidebarMobile();
        }

        function renderSidebarList() {
            const listDiv = document.getElementById('order-list');
            listDiv.innerHTML = '';
            let savedOrders = JSON.parse(localStorage.getItem('pedidos_lista') || '[]');
            
            savedOrders.forEach(order => {
                const div = document.createElement('div');
                div.className = 'order-item';
                div.onclick = () => loadOrder(order.id);
                
                div.innerHTML = `
                    <span title="${order.name}">${order.name}</span>
                    <button class="delete-btn" onclick="deleteOrder('${order.id}', event)">X</button>
                `;
                listDiv.appendChild(div);
            });
        }

        // --- GERADOR DE PDF ---
        function gerarPDF() {
    const element = document.getElementById('folha-pedido');
    const nomeCli = document.getElementById('cli-nome').value || 'Avulso';
    
    document.querySelectorAll('input').forEach(inp => {
        if(inp.type === 'checkbox') {
            if(inp.checked) inp.setAttribute('checked', 'checked');
            else inp.removeAttribute('checked');
        } else {
            inp.setAttribute('value', inp.value);
        }
    });

    element.classList.add('pdf-mode');

    // Força layout antes de capturar
    const larguraReal = element.scrollWidth;
    const alturaReal = element.scrollHeight;

    const opt = {
        margin:       0,
        filename:     `Pedido_${nomeCli}.pdf`,
        image:        { type: 'jpeg', quality: 1 },
        pagebreak:    { mode: ['css', 'legacy'], avoid: 'tr' },
        html2canvas:  { 
            scale: 2, 
            width: larguraReal,
            height: alturaReal,
            windowWidth: larguraReal,
            windowHeight: alturaReal,
            scrollX: 0,
            scrollY: 0,
            useCORS: true
        },
        jsPDF:        { 
            unit: 'mm', 
            format: 'a4', 
            orientation: 'portrait' 
        }
    };

    html2pdf().set(opt).from(element).save().then(() => {
        element.classList.remove('pdf-mode');
    });
}

        window.onload = () => {
            renderSidebarList();
            const draft = localStorage.getItem('pedido_draft');
            if (draft) {
                populateData(JSON.parse(draft));
            } else {
                populateData({});
            }
        };

    </script>
</body>
</html>
