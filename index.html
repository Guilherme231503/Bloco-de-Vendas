<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Pedidos - Gerenciador de Pedidos</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Biblioteca para gerar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Biblioteca para gerar PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>
<body>

    <!-- LOADING OVERLAY -->
    <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
        <div class="loading-box">
            <i class="fas fa-spinner"></i>
            <div class="loading-text">Gerando documento...</div>
        </div>
    </div>

    <!-- BARRA LATERAL -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-folder-open"></i>
            <span>Pedidos Salvos</span>
        </div>
        <div class="order-list" id="order-list">
            <!-- Itens carregados via JS -->
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-area">
        <!-- Barra de Ferramentas -->
        <div class="topbar">
            <div class="brand">
                <i class="fas fa-file-invoice"></i>
                <span>Pedidos</span>
            </div>
            <button type="button" class="btn menu-toggle" onclick="toggleSidebar()" aria-label="Abrir pedidos salvos" title="Pedidos salvos">
                <i class="fas fa-bars"></i>
            </button>
            <div class="topbar-actions">
                <button type="button" class="btn" onclick="novoPedido()" title="Novo pedido (Alt+N)">
                    <i class="fas fa-plus"></i> Novo
                </button>
                <button type="button" class="btn btn-primary" onclick="salvarPedidoNomeado()" title="Salvar (Ctrl+S)">
                    <i class="fas fa-save"></i> Salvar
                </button>
                <button type="button" class="btn btn-success" onclick="gerarPDFAltaQualidade()" title="PDF em alta qualidade">
                    <i class="fas fa-file-pdf"></i> PDF 300 DPI
                </button>
                <button type="button" class="btn" onclick="gerarPDFBaixaQualidade()" title="PDF leve">
                    <i class="fas fa-file-pdf"></i> PDF 72 DPI
                </button>
                <button type="button" class="btn" onclick="gerarPNG()" title="Exportar imagem PNG">
                    <i class="fas fa-file-image"></i> PNG
                </button>
                <button type="button" class="btn" id="btn-fs" onclick="toggleFullscreen()" title="Tela cheia (Alt+F)" aria-label="Tela cheia">
                    <i class="fas fa-expand"></i> Tela cheia
                </button>
            </div>
        </div>

        <!-- Área do Papel -->
        <div class="paper-container" onclick="closeSidebarMobile()">
            <div class="page" id="folha-pedido">
                <div class="border-box">

                    <!-- Cabeçalho -->
                    <div class="header-section">
                        <div class="pedido-box">
                            <span class="label">PEDIDO Nº</span>
                            <input type="text" id="pedido-num" oninput="saveDraft()" autocomplete="off" enterkeyhint="next">
                        </div>
                        <div class="data-box">
                            <span class="label">DATA</span>
                            <div class="data-inputs">
                                <input type="text" id="data-d" maxlength="2" oninput="saveDraft()" placeholder="DD" aria-label="Dia">
                                <span>/</span>
                                <input type="text" id="data-m" maxlength="2" oninput="saveDraft()" placeholder="MM" aria-label="Mês">
                                <span>/</span>
                                <input type="text" id="data-a" maxlength="4" oninput="saveDraft()" placeholder="AAAA" aria-label="Ano">
                            </div>
                        </div>
                    </div>

                    <!-- Dados Cliente -->
                    <div class="flex-row">
                        <div class="col" style="width: 70%;">
                            <span class="label"><i class="fas fa-user" style="margin-right:4px;"></i>NOME:</span>
                            <input type="text" id="cli-nome" oninput="saveDraft()" autocomplete="name" autocapitalize="words" enterkeyhint="next">
                        </div>
                        <div class="col" style="width: 30%;">
                            <span class="label"><i class="fas fa-phone" style="margin-right:4px;"></i>TEL:</span>
                            <input type="text" id="cli-tel" oninput="saveDraft()" autocomplete="tel" enterkeyhint="next">
                        </div>
                    </div>
                    <div class="flex-row">
                        <div class="col" style="width: 70%;">
                            <span class="label"><i class="fas fa-home" style="margin-right:4px;"></i>ENDEREÇO:</span>
                            <input type="text" id="cli-end" oninput="saveDraft()" autocomplete="street-address" autocapitalize="words" enterkeyhint="next">
                        </div>
                        <div class="col" style="width: 30%;">
                            <span class="label">BAIRRO:</span>
                            <input type="text" id="cli-bairro" oninput="saveDraft()" autocapitalize="words" enterkeyhint="next">
                        </div>
                    </div>
                    <div class="flex-row">
                        <div class="col" style="width: 60%;">
                            <span class="label"><i class="fas fa-city" style="margin-right:4px;"></i>MUNICIPIO:</span>
                            <input type="text" id="cli-mun" oninput="saveDraft()" autocapitalize="words" enterkeyhint="next">
                        </div>
                        <div class="col" style="width: 15%;">
                            <span class="label">UF</span>
                            <input type="text" id="cli-uf" maxlength="2" style="text-align:center;" oninput="saveDraft()" enterkeyhint="next">
                        </div>
                        <div class="col" style="width: 25%;">
                            <span class="label"><i class="fas fa-map-pin"></i> CEP</span>
                            <input type="text" id="cli-cep" oninput="saveDraft()" autocomplete="postal-code" enterkeyhint="next">
                        </div>
                    </div>

                    <!-- Tabela de Itens -->
                    <div class="items-section">
                        <table>
                            <thead>
                                <tr>
                                    <th class="col-quant"><i class="fas fa-hashtag"></i> QUANT.</th>
                                    <th class="col-desc"><i class="fas fa-align-left"></i> DESCRIÇÃO</th>
                                    <th class="col-preco"><i class="fas fa-dollar-sign"></i> PREÇO UNT.</th>
                                    <th class="col-total"><i class="fas fa-calculator"></i> TOTAL</th>
                                </tr>
                            </thead>
                            <tbody id="items-body">
                                <!-- Linhas geradas via JS -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Rodapé -->
                    <div class="footer-section">
                        <div class="footer-left"></div>
                        <div class="footer-right">
                            <span class="total-label"><i class="fas fa-calculator"></i> TOTAL R$:</span>
                            <div class="total-value" id="total-geral">R$ 0,00</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- ===== Extras de interface (fora do papel, não entram no PDF) ===== -->
    <div class="ux-total" id="ux-total" aria-live="polite">
        <i class="fas fa-calculator"></i>
        <span class="ux-total-count" id="ux-total-count">0 itens</span>
        <strong id="ux-total-val">R$ 0,00</strong>
    </div>
    <div class="ux-status" id="ux-status" aria-live="polite"></div>
    <div class="ux-fab" id="ux-fab">
        <button type="button" class="ux-fab-btn" onclick="toggleToolbarFS()" aria-label="Mostrar/ocultar barra de ferramentas" title="Barra de ferramentas">
            <i class="fas fa-sliders"></i>
        </button>
        <button type="button" class="ux-fab-btn" onclick="toggleFullscreen()" aria-label="Sair da tela cheia" title="Sair da tela cheia (Esc)">
            <i class="fas fa-compress"></i>
        </button>
    </div>
    <div id="ux-toasts" class="ux-toasts" aria-live="assertive"></div>
    <div id="ux-modal-host"></div>

    <style>
        /* ============================================================
           Apenas o necessário para a ANIMAÇÃO dos números e para a
           responsividade Android — não altera nenhuma cor, fonte,
           layout de papel ou variáveis do CSS dinâmico já carregado.
        ============================================================ */

        /* --- Efeito de "número rolando com blur" (estilo app financeiro) --- */
        .total-value {
            position: relative;
            display: inline-block;
            overflow: hidden;
        }
        .total-value .num-roll {
            display: inline-block;
            animation: numRollIn 0.38s cubic-bezier(.22,.68,.36,1);
            filter: blur(0);
        }
        @keyframes numRollIn {
            0%   { transform: translateY(45%); opacity: 0; filter: blur(6px); }
            60%  { opacity: 1; }
            100% { transform: translateY(0);   opacity: 1; filter: blur(0); }
        }
        .item-t.pulsing {
            animation: fieldPulse 0.35s ease;
        }
        @keyframes fieldPulse {
            0%   { filter: blur(3px); opacity: .5; }
            100% { filter: blur(0);   opacity: 1; }
        }

        /* --- Responsividade extra para Android/telas pequenas ---
           Só ajusta espaçamentos/quebras/visibilidade de texto,
           sem redefinir cores/fontes/variáveis do CSS dinâmico. */

        /* Base global: evita qualquer estouro horizontal em Android */
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
        }
        * { box-sizing: border-box; }

        .topbar, .topbar-actions, .header-section, .flex-row,
        .pedido-box, .data-box, .footer-section, .footer-right,
        .sidebar, .paper-container, .page {
            min-width: 0;
        }

        /* Textos longos nunca estouram a caixa: truncam com reticências
           em vez de quebrar layout (conforme pedido: "diminuindo/escondendo") */
        .brand span,
        .btn span,
        .label,
        .order-item span,
        .sidebar-header span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        input {
            min-width: 0;
            max-width: 100%;
        }

        @media (max-width: 600px) {
            .topbar {
                flex-wrap: wrap;
                gap: 6px;
                padding-left: 8px;
                padding-right: 8px;
            }

            .brand span { max-width: 30vw; }

            .topbar-actions {
                flex-wrap: wrap;
                gap: 6px;
                width: 100%;
                justify-content: flex-start;
            }
            .topbar-actions .btn {
                flex: 1 1 auto;
                min-width: 0;
                max-width: 100%;
                font-size: 0.78em;
                padding: 8px 4px;
                justify-content: center;
                white-space: nowrap;
                overflow: hidden;
            }
            .topbar-actions .btn i { margin-right: 4px; flex-shrink: 0; }
        }

        /* Telas muito estreitas (Android pequenos/dobráveis fechados):
           esconde o texto dos botões de ação, mantendo só o ícone,
           para não estourar nem espremer a barra de ferramentas. */
        @media (max-width: 380px) {
            .topbar-actions .btn span,
            .topbar-actions .btn { font-size: 0; padding: 8px; }
            .topbar-actions .btn i {
                font-size: 1rem;
                margin-right: 0;
            }
            .brand span { max-width: 22vw; }
        }

        @media (max-width: 480px) {
            .flex-row { flex-wrap: wrap; }
            .flex-row .col { width: 100% !important; margin-bottom: 6px; }

            .header-section { flex-wrap: wrap; gap: 8px; }
            .pedido-box, .data-box { width: 100%; }
            .data-inputs { flex-wrap: nowrap; }
            .data-inputs input { min-width: 0; }

            .label {
                max-width: 100%;
                display: inline-block;
            }

            table, thead, tbody, th, td, tr { display: block; width: 100%; }
            .items-section table thead { display: none; }
            .items-section table tbody tr {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 4px 8px;
                margin-bottom: 8px;
            }
            .col-desc { grid-column: 1 / -1; }
            .col-quant::before   { content: "Quant."; display:block; font-size:.7em; opacity:.65; }
            .col-desc::before    { content: "Descrição"; display:block; font-size:.7em; opacity:.65; }
            .col-preco::before   { content: "Preço Unt."; display:block; font-size:.7em; opacity:.65; }
            .col-total::before   { content: "Total"; display:block; font-size:.7em; opacity:.65; }

            .col-quant input, .col-desc input, .col-preco input, .col-total input {
                text-overflow: ellipsis;
            }

            .footer-section { flex-direction: column; align-items: stretch; gap: 10px; }
            .footer-right { justify-content: space-between; flex-wrap: wrap; }
            .total-label span { display: none; } /* mantém só o texto essencial via CSS content abaixo */
            .total-value {
                max-width: 60vw;
                text-overflow: ellipsis;
            }

            .sidebar { max-width: 85vw; }
            .order-item span {
                display: inline-block;
                max-width: 70%;
                vertical-align: middle;
            }
        }

        @media (max-width: 480px) and (orientation: portrait) {
            .paper-container { padding: 6px; }
        }

        /* Telas de altura curta (teclado Android aberto): reduz respiro
           vertical da topbar/sidebar sem alterar cores ou tipografia. */
        @media (max-height: 480px) and (max-width: 900px) {
            .topbar { padding-top: 6px; padding-bottom: 6px; }
            .sidebar-header { padding-top: 6px; padding-bottom: 6px; }
        }

        /* Evita que ícones/inputs quebrem em telas ultra estreitas (<=340px) */
        @media (max-width: 340px) {
            .pedido-box .label, .data-box .label { font-size: 0.75em; }
            .col label, .flex-row .label { font-size: 0.75em; }
        }
    </style>

    <style id="ux-extras">
        /* ============================================================
           CAMADA EXTRA DE INTERFACE (aditiva)
           Só adiciona classes novas (.ux-*) e pequenos refinamentos.
           O CSS dinâmico por dispositivo (./css/*.css) NÃO é alterado.
        ============================================================ */

        /* ---------- Feedback de toque / foco ---------- */
        .btn:active { transform: scale(.97); }
        .paper-container input:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 1px;
        }
        #items-body tr:focus-within {
            background-image: linear-gradient(rgba(37,99,235,.08), rgba(37,99,235,.08));
        }
        #items-body tr.ux-row-in { animation: uxRowIn .28s ease both; }
        @keyframes uxRowIn { from { opacity: 0; } to { opacity: 1; } }

        /* Alvos de toque maiores em telas touch */
        @media (pointer: coarse) {
            .btn, .delete-btn { min-height: 40px; }
            .delete-btn { min-width: 40px; }
            .order-item { min-height: 46px; }
        }

        /* Evita zoom automático do iOS ao focar campos no celular */
        @media (max-width: 480px) {
            #folha-pedido input { font-size: max(16px, 1em); }
        }

        /* Tablet: barra de ferramentas quebra em linhas em vez de estourar */
        @media (min-width: 601px) and (max-width: 1024px) {
            .topbar-actions { flex-wrap: wrap; gap: 6px; }
            .paper-container { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
        }

        /* Desktop largo: respiro extra ao redor do papel */
        @media (min-width: 1280px) {
            .paper-container { scroll-behavior: smooth; }
        }

        /* ---------- Durante a exportação ---------- */
        body.exporting .topbar-actions .btn { pointer-events: none; opacity: .55; }
        /* Garante que animações não congelem no meio ao capturar PDF/PNG */
        #folha-pedido.pdf-mode *,
        #folha-pedido.pdf-mode *::before,
        #folha-pedido.pdf-mode *::after {
            animation: none !important;
            transition: none !important;
        }
        #folha-pedido.pdf-mode #items-body tr { background-image: none !important; }
        #folha-pedido.pdf-mode input { outline: none !important; caret-color: transparent; }

        /* ---------- Busca na barra lateral ---------- */
        .ux-search { position: relative; padding: 8px 10px; }
        .ux-search i {
            position: absolute; left: 20px; top: 50%;
            transform: translateY(-50%); opacity: .55; pointer-events: none;
            font-size: .85em;
        }
        .ux-search input {
            width: 100%; padding: 9px 10px 9px 32px;
            border-radius: 10px; font: inherit; color: inherit;
            background: rgba(127,127,127,.12);
            border: 1px solid rgba(127,127,127,.3);
            outline: none;
        }
        .ux-search input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.18); }
        .ux-empty { padding: 22px 14px; text-align: center; opacity: .6; font-size: .9em; line-height: 1.5; }
        .ux-empty i { display: block; font-size: 1.8em; margin-bottom: 8px; opacity: .6; }
        .order-item.ux-active {
            background-image: linear-gradient(rgba(37,99,235,.16), rgba(37,99,235,.16));
            box-shadow: inset 3px 0 0 #2563eb;
        }
        .order-item { animation: uxRowIn .25s ease both; }
        .order-item span small {
            display: block; font-size: .75em; opacity: .65;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* ---------- Total flutuante (celular/tablet) ---------- */
        .ux-total {
            position: fixed; left: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            z-index: 900;
            display: flex; align-items: center; gap: 8px;
            padding: 10px 16px; border-radius: 999px;
            background: rgba(17,24,39,.92); color: #fff;
            box-shadow: 0 6px 20px rgba(0,0,0,.28);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            font-size: .95rem; max-width: calc(100vw - 90px);
            transform: translateX(-140%);
            transition: transform .32s cubic-bezier(.22,.68,.36,1);
            pointer-events: none;
        }
        .ux-total.show { transform: translateX(0); }
        .ux-total .ux-total-count { opacity: .7; font-size: .8em; white-space: nowrap; }
        .ux-total strong { white-space: nowrap; font-variant-numeric: tabular-nums; }
        @media (min-width: 1025px) { .ux-total { display: none; } }

        /* ---------- Indicador de rascunho ---------- */
        .ux-status {
            position: fixed; left: 50%;
            bottom: calc(76px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 10px);
            z-index: 900; padding: 4px 12px; border-radius: 999px;
            background: rgba(17,24,39,.8); color: #fff; font-size: .72rem;
            opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
            white-space: nowrap;
        }
        .ux-status.show { opacity: 1; transform: translate(-50%, 0); }

        /* ---------- Tela cheia ---------- */
        .ux-fab {
            position: fixed; right: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            z-index: 950; display: none; flex-direction: column; gap: 10px;
        }
        body.is-fullscreen .ux-fab { display: flex; }
        .ux-fab-btn {
            width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
            background: rgba(17,24,39,.9); color: #fff; font-size: 1rem;
            box-shadow: 0 6px 18px rgba(0,0,0,.3);
            display: flex; align-items: center; justify-content: center;
            transition: transform .15s, background .2s;
        }
        .ux-fab-btn:hover { background: #2563eb; }
        .ux-fab-btn:active { transform: scale(.92); }
        /* Em tela cheia a barra fica oculta até o usuário chamar */
        body.is-fullscreen:not(.show-bar) .topbar { display: none; }
        /* Se o navegador não suporta fullscreen real (ex.: iPhone), o botão vira "modo foco" */
        body.is-fullscreen .paper-container { scroll-behavior: smooth; }

        /* ---------- Toasts ---------- */
        .ux-toasts {
            position: fixed; left: 50%; transform: translateX(-50%);
            top: calc(12px + env(safe-area-inset-top, 0px));
            z-index: 10001; display: flex; flex-direction: column; gap: 8px;
            align-items: center; pointer-events: none;
            width: calc(100% - 24px); max-width: 420px;
        }
        .ux-toast {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 16px; border-radius: 12px; font-size: .92rem;
            background: rgba(17,24,39,.95); color: #fff; max-width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,.3);
            opacity: 0; transform: translateY(-14px) scale(.96);
            transition: opacity .28s, transform .28s cubic-bezier(.22,.68,.36,1);
        }
        .ux-toast.show { opacity: 1; transform: none; }
        .ux-toast.ux-success i { color: #34d399; }
        .ux-toast.ux-error i { color: #f87171; }
        .ux-toast.ux-info i { color: #60a5fa; }

        /* ---------- Diálogos (substituem prompt/confirm/alert) ---------- */
        .ux-modal-backdrop {
            position: fixed; inset: 0; z-index: 10000;
            display: flex; align-items: center; justify-content: center; padding: 16px;
            background: rgba(15,23,42,.55);
            backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
            animation: uxFade .2s ease both;
        }
        .ux-modal {
            width: 100%; max-width: 420px; padding: 20px; border-radius: 16px;
            background: #fff; color: #111827;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
            animation: uxPop .25s cubic-bezier(.22,.68,.36,1) both;
        }
        .ux-modal-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; }
        .ux-modal-title i { color: #2563eb; }
        .ux-modal.ux-danger .ux-modal-title i { color: #dc2626; }
        .ux-modal-msg { margin: 0 0 14px; line-height: 1.45; opacity: .85; }
        .ux-modal-msg:empty { display: none; }
        .ux-modal-input {
            width: 100%; padding: 12px; font-size: 16px; border-radius: 10px;
            border: 1px solid #cbd5e1; background: #fff; color: inherit; margin-bottom: 16px; outline: none;
        }
        .ux-modal-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.2); }
        .ux-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .ux-mbtn {
            padding: 11px 18px; border-radius: 10px; border: 0; cursor: pointer;
            font: inherit; font-weight: 600; min-height: 44px;
        }
        .ux-mbtn.ux-cancel { background: #e5e7eb; color: #111827; }
        .ux-mbtn.ux-ok { background: #2563eb; color: #fff; }
        .ux-modal.ux-danger .ux-mbtn.ux-ok { background: #dc2626; }
        .ux-mbtn:active { transform: scale(.97); }
        @keyframes uxFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes uxPop { from { opacity: 0; transform: translateY(10px) scale(.95); } to { opacity: 1; transform: none; } }
        @media (prefers-color-scheme: dark) {
            .ux-modal { background: #1e293b; color: #e5e7eb; }
            .ux-modal-input { background: #0f172a; border-color: #334155; }
            .ux-mbtn.ux-cancel { background: #334155; color: #e5e7eb; }
        }
        @media (max-width: 480px) {
            .ux-modal-backdrop { align-items: flex-end; padding: 0; }
            .ux-modal { border-radius: 18px 18px 0 0; max-width: none; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
            .ux-modal-actions .ux-mbtn { flex: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            .ux-toast, .ux-total, .ux-status, .ux-modal, .ux-modal-backdrop, .order-item, #items-body tr.ux-row-in { animation: none !important; transition: none !important; }
        }
    </style>

    <script>
        // ============================================================
        // DETECÇÃO DE DISPOSITIVO E CARGA DE CSS PERSONALIZADO
        // (inalterado — CSS dinâmico permanece como está)
        // ============================================================
        async function carregarCssPorDispositivo() {
            const uaString = navigator.userAgent.toLowerCase();
            let arquivoCss = "default.css";
            const pastaCss = "./css/";

            if (navigator.userAgentData) {
                try {
                    const ua = await navigator.userAgentData.getHighEntropyValues(['platformVersion', 'model']);
                    const plataforma = navigator.userAgentData.platform.toLowerCase();
                    const modelo = ua.model ? ua.model.toLowerCase() : "";

                    if (plataforma === "windows") {
                        const buildWindows = parseInt(ua.platformVersion.split('.'));
                        if (buildWindows >= 14) arquivoCss = "win11.css";
                        else if (buildWindows > 0) arquivoCss = "win10.css";
                        else arquivoCss = checarFallbackWindows(uaString);
                        injetarEstilo(pastaCss + arquivoCss);
                        return;
                    }

                    if (plataforma === "android" || uaString.includes("android")) {
                        arquivoCss = classificarMarcaAndroid(modelo, uaString);
                        injetarEstilo(pastaCss + arquivoCss);
                        return;
                    }
                } catch (e) { /* fallback */ }
            }

            if (uaString.includes("macintosh") && !navigator.maxTouchPoints) {
                const matchMac = uaString.match(/mac os x (\d+)[_.](\d+)/);
                if (matchMac) {
                    const versaoPrincipal = parseInt(matchMac[1]);
                    arquivoCss = `macos${versaoPrincipal}.css`;
                } else {
                    arquivoCss = "macos-generico.css";
                }
                injetarEstilo(pastaCss + arquivoCss);
                return;
            }

            const éiPad = uaString.includes("ipad") || (uaString.includes("macintosh") && navigator.maxTouchPoints > 1);
            const éiPhone = uaString.includes("iphone");

            if (éiPhone || éiPad) {
                const dispositivo = éiPhone ? "ios" : "ipados";
                const matchApple = uaString.match(/os (\d+)_/);
                if (matchApple) {
                    const versaoOS = parseInt(matchApple[1]);
                    arquivoCss = `${dispositivo}${versaoOS}.css`;
                } else {
                    arquivoCss = `${dispositivo}-generico.css`;
                }
                injetarEstilo(pastaCss + arquivoCss);
                return;
            }

            if (uaString.includes("android")) {
                arquivoCss = classificarMarcaAndroid("", uaString);
            } else {
                arquivoCss = checarFallbackWindows(uaString);
            }
            injetarEstilo(pastaCss + arquivoCss);
        }

        function checarFallbackWindows(uaString) {
            if (uaString.includes("windows nt 10.0")) return "win10.css";
            if (uaString.includes("windows nt 6.1")) return "win7.css";
            return "default.css";
        }

        function classificarMarcaAndroid(modelo, uaString) {
            const texto = (modelo + " " + uaString).toLowerCase();
            if (texto.includes("samsung") || texto.includes("sm-") || texto.includes("sec-")) return "samsung.css";
            if (texto.includes("pixel") || texto.includes("nexus")) return "pixel.css";
            if (texto.includes("xiaomi") || texto.includes("redmi") || texto.includes("poco") || texto.includes("mi ")) return "xiaomi.css";
            return "android-generico.css";
        }

        function injetarEstilo(caminhoCompleto) {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.type = "text/css";
            link.href = caminhoCompleto;
            document.getElementsByTagName("head")[0].appendChild(link);
        }

        // Inicializa a carga imediatamente
        carregarCssPorDispositivo();

        // ============================================================
        // LÓGICA PRINCIPAL DO PEDIDO
        // ============================================================
        // ============================================================
        // VERSÃO / LOG NO CONSOLE
        // ============================================================
        const APP_VERSION = '2.3.0';
        const APP_BUILD = '2026-10-24';
        const APP_CHANGELOG = [
            ['2.3.0', 'PNG: fonte 60% maior (!important vence o CSS do tema), altura livre, total e textos sem corte, topo não é mais cortado'],
            ['2.2.0', 'PNG via html-to-image em iframe de 1200px (layout de PC), com plano B em html2canvas'],
            ['2.1.0', 'PDF: fonte 20% maior, layout A4 no celular, quebra de página entre linhas, retry de qualidade'],
            ['2.0.0', 'Tela cheia/modo foco, total flutuante, diálogos e toasts, busca de pedidos, máscaras, atalhos, correção de bugs']
        ];

        function logVersao() {
            const estiloTitulo = 'background:#2563eb;color:#fff;padding:3px 8px;border-radius:4px;font-weight:700';
            const estiloInfo = 'color:#2563eb;font-weight:600';
            console.log(`%cPedidos v${APP_VERSION}%c build ${APP_BUILD}`, estiloTitulo, estiloInfo);
            console.groupCollapsed('Histórico de versões');
            APP_CHANGELOG.forEach(([v, desc]) => console.log(`%cv${v}%c ${desc}`, 'font-weight:700;color:#2563eb', ''));
            console.groupEnd();
            console.groupCollapsed('Ambiente');
            console.log('Tela cheia nativa:', !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen));
            console.log('Toque:', ('ontouchstart' in window) || navigator.maxTouchPoints > 0);
            console.log('Viewport:', `${window.innerWidth}x${window.innerHeight} @${window.devicePixelRatio}x`);
            console.log('html2canvas:', typeof html2canvas !== 'undefined' ? 'ok' : 'não carregou');
            console.log('jsPDF:', (window.jspdf && window.jspdf.jsPDF) || window.jsPDF ? 'ok' : 'não carregou');
            console.log('CSS por dispositivo:', Array.from(document.querySelectorAll('link[href*="css/"]')).map(l => l.getAttribute('href')).join(', ') || 'nenhum');
            console.groupEnd();
        }
        window.APP_VERSION = APP_VERSION;

        const $ = (sel, root = document) => root.querySelector(sel);
        const tbody = document.getElementById('items-body');
        const MIN_ROWS = 15;
        const EXPORT_W = 794;            // largura A4 em px (96 dpi) usada na exportação
        const PDF_FONT_FACTOR = 1.2;     // aumento da fonte no PDF
        const PNG_FONT_FACTOR = 1.6;     // aumento da fonte no PNG
        const HTI_URL = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';
        const STORE = { draft: 'pedido_draft', list: 'pedidos_lista', active: 'pedido_active_id' };

        let activeOrderId = null;
        let dirty = false;               // alterações não salvas
        let animarLinhas = false;
        let exporting = false;

        // ---------- localStorage seguro ----------
        function lsGet(key, fallback) {
            try {
                const v = localStorage.getItem(key);
                return v === null ? fallback : JSON.parse(v);
            } catch (e) { return fallback; }
        }
        function lsSet(key, val) {
            try { localStorage.setItem(key, JSON.stringify(val)); return true; }
            catch (e) { toast('Não foi possível gravar os dados (armazenamento cheio ou bloqueado).', 'error', 4500); return false; }
        }

        // ============================================================
        // TOASTS E DIÁLOGOS
        // ============================================================
        function toast(msg, type = 'info', ms = 2600) {
            const host = document.getElementById('ux-toasts');
            const icons = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info' };
            const t = document.createElement('div');
            t.className = 'ux-toast ux-' + (icons[type] ? type : 'info');
            t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span></span>`;
            t.querySelector('span').textContent = msg;
            host.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => {
                t.classList.remove('show');
                setTimeout(() => t.remove(), 320);
            }, ms);
        }

        function uiDialog({ title, message = '', input = false, value = '', ok = 'OK', cancel = 'Cancelar', danger = false, icon = 'fa-circle-question' }) {
            return new Promise(resolve => {
                const host = document.getElementById('ux-modal-host');
                const prevFocus = document.activeElement;
                const back = document.createElement('div');
                back.className = 'ux-modal-backdrop';
                back.innerHTML = `
                    <div class="ux-modal ${danger ? 'ux-danger' : ''}" role="dialog" aria-modal="true">
                        <div class="ux-modal-title"><i class="fas ${icon}"></i><span></span></div>
                        <p class="ux-modal-msg"></p>
                        ${input ? '<input type="text" class="ux-modal-input" autocomplete="off">' : ''}
                        <div class="ux-modal-actions">
                            <button type="button" class="ux-mbtn ux-cancel"></button>
                            <button type="button" class="ux-mbtn ux-ok"></button>
                        </div>
                    </div>`;
                back.querySelector('.ux-modal-title span').textContent = title;
                back.querySelector('.ux-modal-msg').textContent = message;
                back.querySelector('.ux-cancel').textContent = cancel;
                back.querySelector('.ux-ok').textContent = ok;
                const field = back.querySelector('.ux-modal-input');
                if (field) field.value = value;

                const close = result => {
                    back.remove();
                    if (prevFocus && prevFocus.focus) try { prevFocus.focus({ preventScroll: true }); } catch (e) {}
                    resolve(result);
                };
                const confirmar = () => close(input ? field.value : true);
                const cancelar = () => close(input ? null : false);

                back.querySelector('.ux-ok').onclick = confirmar;
                back.querySelector('.ux-cancel').onclick = cancelar;
                back.addEventListener('mousedown', e => { if (e.target === back) cancelar(); });
                back.addEventListener('keydown', e => {
                    e.stopPropagation();
                    if (e.key === 'Escape') { e.preventDefault(); cancelar(); }
                    else if (e.key === 'Enter') { e.preventDefault(); confirmar(); }
                });

                host.appendChild(back);
                setTimeout(() => {
                    if (field) { field.focus(); field.select(); }
                    else back.querySelector('.ux-ok').focus();
                }, 30);
            });
        }

        // ============================================================
        // SIDEBAR
        // ============================================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function closeSidebarMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('active');
            }
        }

        // ============================================================
        // TELA CHEIA (com "modo foco" de reserva para iPhone)
        // ============================================================
        const fsRoot = document.documentElement;
        const fsNativo = !!(fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen);
        const fsAtivoNativo = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

        function syncFullscreenUI(ativo) {
            document.body.classList.toggle('is-fullscreen', ativo);
            if (!ativo) document.body.classList.remove('show-bar');
            const btn = document.getElementById('btn-fs');
            if (btn) {
                btn.innerHTML = ativo
                    ? '<i class="fas fa-compress"></i> Sair'
                    : '<i class="fas fa-expand"></i> Tela cheia';
                btn.setAttribute('aria-label', ativo ? 'Sair da tela cheia' : 'Tela cheia');
            }
        }

        async function toggleFullscreen() {
            const ativo = document.body.classList.contains('is-fullscreen');
            try {
                if (!ativo) {
                    if (fsNativo) {
                        const req = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
                        await req.call(fsRoot);
                    }
                    syncFullscreenUI(true);
                    toast(fsNativo ? 'Tela cheia ativada. Use o botão flutuante para a barra de ferramentas.' : 'Modo foco ativado.', 'info', 3200);
                } else {
                    if (fsNativo && fsAtivoNativo()) {
                        const ex = document.exitFullscreen || document.webkitExitFullscreen;
                        await ex.call(document);
                    }
                    syncFullscreenUI(false);
                }
            } catch (e) {
                // Se o navegador recusar, cai para o modo foco
                syncFullscreenUI(!ativo);
            }
        }

        function toggleToolbarFS() {
            document.body.classList.toggle('show-bar');
        }

        function onFsChange() {
            // Usuário saiu com ESC / gesto do sistema
            if (!fsAtivoNativo() && document.body.classList.contains('is-fullscreen') && fsNativo) {
                syncFullscreenUI(false);
            }
        }
        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);

        // ============================================================
        // MOEDA — valores sempre tratados como NÚMERO internamente
        // ============================================================
        function parseMoney(str) {
            if (str === null || str === undefined || str === '') return 0;
            str = String(str).trim().replace(/[^\d.,-]/g, '');
            if (str === '') return 0;

            const temVirgula = str.includes(',');
            const temPonto = str.includes('.');

            if (temVirgula && temPonto) {
                // 9.999,99 -> ponto é milhar, vírgula é decimal
                str = str.replace(/\./g, '').replace(',', '.');
            } else if (temVirgula) {
                str = str.replace(',', '.');
            } else if (temPonto) {
                const partes = str.split('.');
                if (partes.length > 2) {
                    // 1.234.567 -> só milhares
                    str = str.replace(/\./g, '');
                } else if (partes[1].length === 3 && partes[0].length <= 3) {
                    // "1.234" -> milhar (padrão BR)
                    str = str.replace('.', '');
                }
            }
            const n = parseFloat(str);
            return isNaN(n) ? 0 : n;
        }

        function formatMoneyDisplay(value, comPrefixo = false) {
            const n = isNaN(value) ? 0 : Number(value);
            const formatado = n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            return comPrefixo ? `R$ ${formatado}` : formatado;
        }
        function formatMoney(value) { return formatMoneyDisplay(value, false); }

        const arred = n => Math.round((n + Number.EPSILON) * 100) / 100;

        // ============================================================
        // LINHAS DA TABELA
        // ============================================================
        function addRow(data = {}) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-quant"><input type="text" inputmode="decimal" class="item-q" aria-label="Quantidade" autocomplete="off" enterkeyhint="next"></td>
                <td class="col-desc"><input type="text" class="item-d" aria-label="Descrição" autocomplete="off" autocapitalize="sentences" enterkeyhint="next"></td>
                <td class="col-preco"><input type="text" inputmode="decimal" class="item-p" aria-label="Preço unitário" autocomplete="off" enterkeyhint="next"></td>
                <td class="col-total"><input type="text" class="item-t" aria-label="Total da linha" tabindex="-1" readonly></td>
            `;
            const qInput = tr.querySelector('.item-q');
            const dInput = tr.querySelector('.item-d');
            const pInput = tr.querySelector('.item-p');
            const tInput = tr.querySelector('.item-t');

            // valores atribuídos via propriedade (evita quebrar com aspas / injeção de HTML)
            qInput.value = data.q ?? '';
            dInput.value = data.d ?? '';
            pInput.value = data.p ?? '';
            tInput.value = data.t ?? '';

            [qInput, pInput, dInput].forEach(inp => {
                inp.addEventListener('input', () => {
                    handleInput(tr);
                    saveDraft();
                });
            });

            // Seleciona o conteúdo ao focar nos campos numéricos (facilita no celular)
            [qInput, pInput].forEach(inp => {
                inp.addEventListener('focus', () => setTimeout(() => { try { inp.select(); } catch (e) {} }, 0));
            });

            // Ao sair do preço, formata bonito (9.999,99)
            pInput.addEventListener('blur', () => {
                const v = parseMoney(pInput.value);
                if (v > 0) pInput.value = formatMoney(v);
            });

            if (animarLinhas) {
                tr.classList.add('ux-row-in');
                tr.addEventListener('animationend', () => tr.classList.remove('ux-row-in'), { once: true });
            }
            tbody.appendChild(tr);
            return tr;
        }

        function totalDaLinha(tr) {
            const q = parseMoney(tr.querySelector('.item-q').value);
            const p = parseMoney(tr.querySelector('.item-p').value);
            return (q > 0 && p > 0) ? arred(q * p) : 0;
        }

        function updateRow(tr, pulse = true) {
            const tInput = tr.querySelector('.item-t');
            const total = totalDaLinha(tr);
            if (total > 0) {
                const novo = formatMoney(total);
                if (tInput.value !== novo) {
                    tInput.value = novo;
                    if (pulse) {
                        tInput.classList.remove('pulsing');
                        void tInput.offsetWidth;
                        tInput.classList.add('pulsing');
                    }
                }
            } else {
                tInput.value = '';
            }
        }

        function handleInput(currentRow) {
            updateRow(currentRow);

            const lastRow = tbody.lastElementChild;
            if (currentRow === lastRow) {
                const hasContent = Array.from(lastRow.querySelectorAll('input')).some(inp => inp.value.trim() !== '');
                if (hasContent) addRow();
            }
            calculateGrandTotal();
        }

        function calculateGrandTotal() {
            let total = 0, itens = 0;
            tbody.querySelectorAll('tr').forEach(tr => {
                const t = totalDaLinha(tr);
                if (t > 0) { total += t; itens++; }
            });
            renderTotalComAnimacao(arred(total), itens);
        }

        // Animação estilo "app financeiro"
        let ultimoTotalExibido = null;
        function renderTotalComAnimacao(total, itens = 0) {
            const textoFinal = `R$ ${formatMoney(total)}`;

            // Total flutuante (celular/tablet)
            const fv = document.getElementById('ux-total-val');
            const fc = document.getElementById('ux-total-count');
            if (fv) fv.textContent = textoFinal;
            if (fc) fc.textContent = itens === 1 ? '1 item' : `${itens} itens`;

            if (ultimoTotalExibido === textoFinal) return;
            ultimoTotalExibido = textoFinal;
            document.getElementById('total-geral').innerHTML = `<span class="num-roll">${textoFinal}</span>`;
        }

        // ============================================================
        // DADOS DO PEDIDO
        // ============================================================
        function gatherData() {
            const v = id => document.getElementById(id).value;
            const data = {
                pedido: v('pedido-num'),
                dataD: v('data-d'), dataM: v('data-m'), dataA: v('data-a'),
                cliente: {
                    nome: v('cli-nome'), tel: v('cli-tel'), end: v('cli-end'),
                    bairro: v('cli-bairro'), mun: v('cli-mun'), uf: v('cli-uf'), cep: v('cli-cep'),
                },
                itens: []
            };
            tbody.querySelectorAll('tr').forEach(row => {
                const q = row.querySelector('.item-q').value;
                const d = row.querySelector('.item-d').value;
                const p = row.querySelector('.item-p').value;
                const t = row.querySelector('.item-t').value;
                if (q || d || p || t) data.itens.push({ q, d, p, t });
            });
            return data;
        }

        function populateData(data) {
            data = data || {};
            const set = (id, val) => { document.getElementById(id).value = val || ''; };
            set('pedido-num', data.pedido);
            set('data-d', data.dataD); set('data-m', data.dataM); set('data-a', data.dataA);
            set('cli-nome', data.cliente?.nome); set('cli-tel', data.cliente?.tel);
            set('cli-end', data.cliente?.end);   set('cli-bairro', data.cliente?.bairro);
            set('cli-mun', data.cliente?.mun);   set('cli-uf', data.cliente?.uf);
            set('cli-cep', data.cliente?.cep);

            const animAntes = animarLinhas;
            animarLinhas = false;
            tbody.innerHTML = '';
            if (Array.isArray(data.itens)) data.itens.forEach(item => addRow(item));
            for (let i = tbody.children.length; i < MIN_ROWS; i++) addRow();
            addRow();
            animarLinhas = animAntes;

            // recalcula as linhas a partir de quant × preço (nunca de texto formatado)
            tbody.querySelectorAll('tr').forEach(tr => updateRow(tr, false));
            ultimoTotalExibido = null;
            calculateGrandTotal();
        }

        function setDefaultDate() {
            const h = new Date();
            document.getElementById('data-d').value = String(h.getDate()).padStart(2, '0');
            document.getElementById('data-m').value = String(h.getMonth() + 1).padStart(2, '0');
            document.getElementById('data-a').value = String(h.getFullYear());
        }

        // ============================================================
        // RASCUNHO (autosave com debounce)
        // ============================================================
        let draftTimer = null;
        let statusTimer = null;

        function setStatus(txt) {
            const el = document.getElementById('ux-status');
            if (!el) return;
            el.textContent = txt;
            el.classList.add('show');
            clearTimeout(statusTimer);
            statusTimer = setTimeout(() => el.classList.remove('show'), 1400);
        }

        function saveDraft() {
            dirty = true;
            clearTimeout(draftTimer);
            draftTimer = setTimeout(persistDraft, 300);
        }

        function persistDraft() {
            clearTimeout(draftTimer);
            draftTimer = null;
            if (lsSet(STORE.draft, gatherData())) setStatus('Rascunho salvo');
        }

        document.addEventListener('visibilitychange', () => { if (document.hidden && draftTimer) persistDraft(); });
        window.addEventListener('pagehide', () => { if (draftTimer) persistDraft(); });

        // ============================================================
        // PEDIDOS SALVOS
        // ============================================================
        async function confirmarDescarte() {
            if (!dirty) return true;
            return uiDialog({
                title: 'Alterações não salvas',
                message: 'Existem alterações que ainda não foram salvas. Deseja descartá-las?',
                ok: 'Descartar', danger: true, icon: 'fa-triangle-exclamation'
            });
        }

        async function salvarPedidoNomeado() {
            const lista = lsGet(STORE.list, []);
            const existente = activeOrderId ? lista.find(o => o.id === activeOrderId) : null;
            const cli = document.getElementById('cli-nome').value.trim();
            const padrao = existente ? existente.name : (cli ? `Pedido - ${cli}` : 'Novo Pedido');

            const nome = await uiDialog({
                title: existente ? 'Atualizar pedido' : 'Salvar pedido',
                message: 'Dê um nome para este pedido:',
                input: true, value: padrao, ok: 'Salvar', icon: 'fa-floppy-disk'
            });
            if (nome === null) return;
            const nm = nome.trim();
            if (!nm) { toast('Informe um nome para salvar.', 'error'); return; }

            const data = gatherData();
            const agora = Date.now();
            if (existente) {
                existente.name = nm;
                existente.data = data;
                existente.updated = agora;
            } else {
                activeOrderId = String(agora);
                lista.push({ id: activeOrderId, name: nm, data, updated: agora });
            }
            if (!lsSet(STORE.list, lista)) return;
            lsSet(STORE.active, activeOrderId);
            persistDraft();
            dirty = false;
            renderSidebarList();
            toast(existente ? 'Pedido atualizado!' : 'Pedido salvo com sucesso!', 'success');
        }

        async function loadOrder(id) {
            if (id !== activeOrderId && !(await confirmarDescarte())) return;
            const order = lsGet(STORE.list, []).find(o => o.id === id);
            if (!order) { toast('Pedido não encontrado.', 'error'); renderSidebarList(); return; }
            activeOrderId = order.id;
            lsSet(STORE.active, activeOrderId);
            populateData(order.data);
            persistDraft();
            dirty = false;
            renderSidebarList();
            closeSidebarMobile();
            toast(`"${order.name}" carregado`, 'info', 1800);
        }

        async function deleteOrder(id, event) {
            if (event) event.stopPropagation();
            const ok = await uiDialog({
                title: 'Apagar pedido', message: 'Tem certeza que deseja apagar este pedido? Esta ação não pode ser desfeita.',
                ok: 'Apagar', danger: true, icon: 'fa-trash'
            });
            if (!ok) return;
            const lista = lsGet(STORE.list, []).filter(o => o.id !== id);
            lsSet(STORE.list, lista);
            if (activeOrderId === id) await novoPedido(true);
            renderSidebarList();
            toast('Pedido apagado.', 'info', 1800);
        }

        async function novoPedido(force = false) {
            if (force !== true && !(await confirmarDescarte())) return;
            activeOrderId = null;
            try { localStorage.removeItem(STORE.active); localStorage.removeItem(STORE.draft); } catch (e) {}
            populateData({});
            setDefaultDate();
            dirty = false;
            persistDraft();
            renderSidebarList();
            closeSidebarMobile();
            const nome = document.getElementById('pedido-num');
            if (window.innerWidth > 768) nome.focus();

        function totalDoPedido(data) {
            return (data?.itens || []).reduce((s, it) => {
                const q = parseMoney(it.q), p = parseMoney(it.p);
                return s + ((q > 0 && p > 0) ? arred(q * p) : 0);
            }, 0);
        }

        function renderSidebarList() {
            const listDiv = document.getElementById('order-list');
            const busca = (document.getElementById('ux-search-input')?.value || '').trim().toLowerCase();
            const todos = lsGet(STORE.list, []);
            const lista = todos.slice().reverse().filter(o =>
                !busca || (o.name || '').toLowerCase().includes(busca) ||
                (o.data?.cliente?.nome || '').toLowerCase().includes(busca) ||
                String(o.data?.pedido || '').toLowerCase().includes(busca)
            );

            if (!lista.length) {
                const vazio = document.createElement('div');
                vazio.className = 'ux-empty';
                vazio.innerHTML = '<i class="fas fa-folder-open"></i><span></span>';
                vazio.querySelector('span').textContent = todos.length
                    ? 'Nenhum pedido encontrado.'
                    : 'Nenhum pedido salvo ainda. Preencha um pedido e toque em Salvar.';
                listDiv.appendChild(vazio);
                return;
            }

            lista.forEach(order => {
                const div = document.createElement('div');
                div.className = 'order-item' + (order.id === activeOrderId ? ' ux-active' : '');
                div.tabIndex = 0;
                div.setAttribute('role', 'button');
                div.onclick = () => loadOrder(order.id);
                div.onkeydown = e => { if (e.key === 'Enter') loadOrder(order.id); };

                const total = totalDoPedido(order.data);
                const d = order.data || {};
                const dataTxt = (d.dataD && d.dataM) ? `${d.dataD}/${d.dataM}${d.dataA ? '/' + d.dataA : ''}` : '';
                const meta = [dataTxt, total > 0 ? formatMoneyDisplay(total, true) : ''].filter(Boolean).join(' · ');

                const span = document.createElement('span');
                const ic = document.createElement('i');
                ic.className = 'fas fa-file-alt';
                span.appendChild(ic);
                span.appendChild(document.createTextNode(' ' + order.name));
                if (meta) {
                    const small = document.createElement('small');
                    small.textContent = meta;
                    span.appendChild(small);
                }
                span.title = order.name;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'delete-btn';
                btn.setAttribute('aria-label', 'Apagar pedido');
                btn.innerHTML = '<i class="fas fa-times"></i>';
                btn.addEventListener('click', e => deleteOrder(order.id, e));

                div.appendChild(span);
                div.appendChild(btn);
                listDiv.appendChild(div);
            });
        }

        // ============================================================
        // MÁSCARAS E COMPORTAMENTOS DOS CAMPOS

        function formatTel(v) {
            const d = v.replace(/\D/g, '');
            if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
            if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
            if (d.length === 9)  return `${d.slice(0, 5)}-${d.slice(5)}`;
            if (d.length === 8)  return `${d.slice(0, 4)}-${d.slice(4)}`;
            return v;
        }
        function formatCep(v) {
            const d = v.replace(/\D/g, '');
            return d.length === 8 ? `${d.slice(0, 5)}-${d.slice(5)}` : v;
        }

        function setupMasks() {
            const d = $('#data-d'), m = $('#data-m'), a = $('#data-a');
            [d, m, a].forEach(el => {
                el.inputMode = 'numeric';
                el.autocomplete = 'off';
                el.addEventListener('input', () => {
                    const c = el.value.replace(/\D/g, '');
                    if (c !== el.value) el.value = c;
                });
                el.addEventListener('focus', () => setTimeout(() => { try { el.select(); } catch (e) {} }, 0));
            });
            d.addEventListener('input', e => {
                if (d.value.length === 2 && e.inputType !== 'deleteContentBackward') {
                    if (parseInt(d.value, 10) > 31) d.value = '31';
                    m.focus();
                }
            });
            m.addEventListener('input', e => {
                if (m.value.length === 2 && e.inputType !== 'deleteContentBackward') {
                    if (parseInt(m.value, 10) > 12) m.value = '12';
                    a.focus();
                }
            });
            const pad = el => { if (el.value.length === 1 && el.value !== '0') { el.value = '0' + el.value; saveDraft(); } };
            d.addEventListener('blur', () => pad(d));
            m.addEventListener('blur', () => pad(m));
            a.addEventListener('blur', () => { if (a.value.length === 2) { a.value = '20' + a.value; saveDraft(); } });

            const tel = $('#cli-tel');
            tel.inputMode = 'tel';
            tel.addEventListener('blur', () => { const f = formatTel(tel.value); if (f !== tel.value) { tel.value = f; saveDraft(); } });

            const cep = $('#cli-cep');
            cep.inputMode = 'numeric';
            cep.addEventListener('blur', () => { const f = formatCep(cep.value); if (f !== cep.value) { cep.value = f; saveDraft(); } });

            const uf = $('#cli-uf');
            uf.autocapitalize = 'characters';
            uf.addEventListener('input', () => {
                const f = uf.value.replace(/[^a-zA-Z]/g, '').toUpperCase();

            });

        function setupKeyboard() {
            // Enter avança para o próximo campo (Shift+Enter volta)
            document.addEventListener('keydown', e => {
                if (e.key === 'Enter' && e.target instanceof HTMLInputElement && e.target.closest('#folha-pedido')) {
                    e.preventDefault();
                    const campos = Array.from(document.querySelectorAll('#folha-pedido input:not([readonly])'));
                    const i = campos.indexOf(e.target);
                    const alvo = campos[i + (e.shiftKey ? -1 : 1)];
                    if (alvo) alvo.focus();
                    else e.target.blur();
                    return;
                }

                const mod = e.ctrlKey || e.metaKey;
                if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); salvarPedidoNomeado(); }
                else if (e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); novoPedido(); }
                else if (e.altKey && e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFullscreen(); }
                else if (e.key === 'Escape') {
                    document.getElementById('sidebar').classList.remove('active');
                    document.body.classList.remove('show-bar');
                }
            });
        }

        function setupSidebarGestures() {
            let tx = 0, ty = 0, rastreando = false;
            document.addEventListener('touchstart', e => {
                if (window.innerWidth > 768 || e.touches.length !== 1) return;
                tx = e.touches[0].clientX; ty = e.touches[0].clientY; rastreando = true;
            }, { passive: true });
            document.addEventListener('touchend', e => {
                if (!rastreando) return;
                rastreando = false;
                const t = e.changedTouches[0];
                const dx = t.clientX - tx, dy = t.clientY - ty;
                if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
                const sb = document.getElementById('sidebar');
                if (dx > 0 && tx < 28) sb.classList.add('active');
                else if (dx < 0 && sb.classList.contains('active')) sb.classList.remove('active');
            }, { passive: true });
        }

        function prepararCamposParaExport() {
            document.querySelectorAll('input').forEach(inp => {
                if (inp.type === 'checkbox') {
                    if (inp.checked) inp.setAttribute('checked', 'checked');
                    else inp.removeAttribute('checked');
